function genererContrat(c, lang) {
  var d = T[lang];
  var p = PROFILS[lang][c.profil];
  var blocs = [];
  var i;
  blocs.push({ t: BASE[lang][0] });
  for (i = 0; i < p.clauses.length; i++) { blocs.push({ t: p.clauses[i] }); }
  for (i = 1; i < BASE[lang].length; i++) { blocs.push({ t: BASE[lang][i] }); }
  blocs.push({ t: PERM[lang][c.permission] });
  var argent = c.sansAchat
    ? d.argent_sans1 + " " + d.argent_sans2 + " " + c.plafondAchat + " $. " + d.argent_sans3 + " " + c.plafondMois + " $."
    : d.argent_avec1 + " " + c.plafondAchat + " $ " + d.argent_avec2 + " " + c.plafondMois + " $ " + d.argent_avec3 + " " + d.argent_avec4;
  blocs.push({ t: argent });
  blocs.push({ l: d.donnees_titre, items: c.donnees });
  var ton = (c.ton === "franc" ? d.ton_franc : d.ton_doux)
    + " " + (c.longueur === "courte" ? d.long_courte : d.long_detaillee)
    + " " + d.langue_reponse;
  blocs.push({ t: ton });
  blocs.push({ t: d.revision });
  var court = BASE[lang][0] + " " + p.clauses[0] + " " + BASE[lang].slice(1).join(" ") + " " + argent
    + "\n" + d.donnees_titre
    + "\n" + c.donnees.map(function (x) { return "- " + x; }).join("\n")
    + "\n" + ton;
  var long = blocs.map(function (b, j) {
    if (b.l) { return (j + 1) + ". " + b.l + "\n" + b.items.map(function (x) { return "- " + x; }).join("\n"); }
    return (j + 1) + ". " + b.t;
  }).join("\n");
  return { profil: p.nom, blocs: blocs, court: court, long: long };
}

function pad2(n) { return (n < 10 ? "0" : "") + n; }
function fmtJour(d) { return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()); }
function construireICS(rev, lang) {
  var d = T[lang];
  var lignes = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//HP Outils//Contrat humain-IA//" + (lang === "fr" ? "FR" : "EN"),
    "BEGIN:VEVENT",
    "UID:contrat-humain-ia-" + fmtJour(rev) + "@hp-outils",
    "DTSTAMP:" + fmtJour(new Date()) + "T000000Z",
    "DTSTART:" + fmtJour(rev) + "T090000",
    "SUMMARY:" + d.ics_resume,
    "DESCRIPTION:" + d.ics_desc,
    "END:VEVENT",
    "END:VCALENDAR"
  ];
  return lignes.join("\r\n") + "\r\n";
}

function formaterDate(d, lang) {
  return d.toLocaleDateString(lang === "fr" ? "fr-CA" : "en-CA", { day: "numeric", month: "long", year: "numeric" });
}

function ech(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

if (typeof document !== "undefined") {
  var lang = "fr";
  var etape = 1;
  var derniereRevision = null;
  function montrer(n) {
    etape = Math.max(1, Math.min(5, n));
    for (var i = 1; i <= 5; i++) {
      document.getElementById("etape-" + i).className = (i === etape) ? "etape visible" : "etape";
    }
    document.getElementById("indicateur").textContent = T[lang].titres[etape];
    document.getElementById("precedent").style.display = (etape === 1) ? "none" : "inline-block";
    document.getElementById("suivant").style.display = (etape === 5) ? "none" : "inline-block";
    document.getElementById("generer").style.display = (etape === 5) ? "inline-block" : "none";
  }
  function choixRadio(nom) {
    var els = document.getElementsByName(nom);
    for (var i = 0; i < els.length; i++) { if (els[i].checked) { return els[i].value; } }
    return null;
  }
  function appliquerLangue(l) {
    lang = l;
    document.documentElement.lang = l;
    document.title = T[l].titre_page;
    var els = document.querySelectorAll("[data-k]");
    for (var i = 0; i < els.length; i++) { els[i].textContent = T[l][els[i].getAttribute("data-k")]; }
    document.getElementById("donnee-autre").placeholder = T[l].donnee_autre_ph;
    document.getElementById("lang-fr").setAttribute("aria-pressed", l === "fr" ? "true" : "false");
    document.getElementById("lang-en").setAttribute("aria-pressed", l === "en" ? "true" : "false");
    document.getElementById("lang-fr").className = (l === "fr") ? "actif" : "secondaire";
    document.getElementById("lang-en").className = (l === "en") ? "actif" : "secondaire";
    montrer(etape);
    if (document.getElementById("resultat").style.display === "block") { generer(); }
  }
  function copierTexte(texte, zone) {
    var ok = document.getElementById(zone);
    function confirme() { ok.textContent = " " + T[lang].copie_ok; }
    function secours() {
      var z = document.createElement("textarea");
      z.value = texte;
      document.body.appendChild(z);
      z.select();
      try { document.execCommand("copy"); confirme(); } catch (e) { ok.textContent = " " + T[lang].copie_echec; }
      document.body.removeChild(z);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texte).then(confirme).catch(secours);
    } else { secours(); }
  }
  function generer() {
    var cles = [];
    var cases = document.getElementsByClassName("donnee");
    for (var i = 0; i < cases.length; i++) { if (cases[i].checked) { cles.push(cases[i].value); } }
    var donnees = cles.map(function (k) { return ITEMS[lang][k]; });
    var autre = document.getElementById("donnee-autre").value.trim();
    if (autre !== "") { donnees.push(autre); }
    if (donnees.length === 0) { donnees.push(T[lang].donnees_rien); }
    var c = {
      profil: choixRadio("profil"),
      permission: choixRadio("permission"),
      sansAchat: document.getElementById("sans-achat").checked,
      plafondAchat: document.getElementById("plafond-achat").value || "50",
      plafondMois: document.getElementById("plafond-mois").value || "200",
      donnees: donnees,
      ton: choixRadio("ton"),
      longueur: choixRadio("longueur")
    };
    var r = genererContrat(c, lang);
    var auj = new Date();
    var rev = new Date(auj.getFullYear(), auj.getMonth() + 3, auj.getDate());
    derniereRevision = rev;
    document.getElementById("feuille-profil").textContent = r.profil;
    document.getElementById("feuille-date").textContent = formaterDate(auj, lang);
    document.getElementById("feuille-revision").textContent = formaterDate(rev, lang);
    document.getElementById("feuille-clauses").innerHTML = r.blocs.map(function (b) {
      if (b.l) { return "<li>" + ech(b.l) + "<ul>" + b.items.map(function (x) { return "<li>" + ech(x) + "</li>"; }).join("") + "</ul></li>"; }
      return "<li>" + ech(b.t) + "</li>";
    }).join("");
    document.getElementById("texte-court").textContent = r.court;
    document.getElementById("texte-long").textContent = r.long;
    document.getElementById("ics-ok").textContent = "";
    document.getElementById("resultat").style.display = "block";
    document.getElementById("resultat").scrollIntoView();
  }
  document.getElementById("lang-fr").addEventListener("click", function () { appliquerLangue("fr"); });
  document.getElementById("lang-en").addEventListener("click", function () { appliquerLangue("en"); });
  document.getElementById("precedent").addEventListener("click", function () { montrer(etape - 1); });
  document.getElementById("suivant").addEventListener("click", function () { montrer(etape + 1); });
  document.getElementById("generer").addEventListener("click", generer);
  document.getElementById("copier-court").addEventListener("click", function () {
    copierTexte(document.getElementById("texte-court").textContent, "copie-court-ok");
  });
  document.getElementById("copier-long").addEventListener("click", function () {
    copierTexte(document.getElementById("texte-long").textContent, "copie-long-ok");
  });
  document.getElementById("imprimer").addEventListener("click", function () {
    document.body.classList.add("print-feuille");
    function nettoyer() { document.body.classList.remove("print-feuille"); }
    window.onafterprint = nettoyer;
    window.print();
    setTimeout(nettoyer, 1500);
  });
  document.getElementById("telecharger-ics").addEventListener("click", function () {
    if (!derniereRevision) { return; }
    var ics = construireICS(derniereRevision, lang);
    var blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = T[lang].ics_fichier;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    document.getElementById("ics-ok").textContent = T[lang].ics_ok;
  });
  document.getElementById("recommencer").addEventListener("click", function () {
    document.getElementById("resultat").style.display = "none";
    derniereRevision = null;
    montrer(1);
    window.scrollTo(0, 0);
  });
  appliquerLangue("fr");
}
