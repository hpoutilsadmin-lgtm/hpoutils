<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Que vois-tu ?</title>
    <style>
      :root{
        --paper:#faf4e8;
        --card:#fffdf6;
        --ink:#26324a;
        --ink-soft:#5a6a86;
        --accent:#d95f36;
        --accent-soft:#fbe3d7;
        --teal:#2e7d74;
        --gold:#e0a83c;
        --line:#26324a;
        --shadow:0 6px 0 rgba(38,50,74,.14);
      }
      @media (prefers-color-scheme: dark){
        :root{
          --paper:#161c2a;
          --card:#212a3f;
          --ink:#ece5d3;
          --ink-soft:#a9b4c9;
          --accent:#ef7d52;
          --accent-soft:#41303a;
          --teal:#4fb3a6;
          --gold:#eec35e;
          --line:#ece5d3;
          --shadow:0 6px 0 rgba(0,0,0,.35);
        }
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ margin:0; padding:0; }
      body{
        background:var(--paper);
        color:var(--ink);
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        min-height:100vh;
        display:flex; flex-direction:column; align-items:center;
        padding:14px 14px 30px;
      }
      .wrap{ width:100%; max-width:430px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
      .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
      .lvlname{ font-weight:700; font-size:.95rem; color:var(--ink-soft); }
      .dots{ display:flex; gap:4px; flex-wrap:wrap; min-width:0; }
      .dot{ width:10px; height:10px; border-radius:50%; border:2px solid var(--line); background:transparent; opacity:.55; flex:0 0 auto; }
      .dot.done{ background:var(--accent); border-color:var(--accent); opacity:1; }
      .dot.now{ background:var(--gold); border-color:var(--gold); opacity:1; transform:scale(1.2); }
      .sndbtn{
        border:2px solid var(--line); background:var(--card); color:var(--ink);
        width:44px; height:44px; border-radius:14px 4px 14px 4px;
        display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;
      }
      .sndbtn:active{ transform:scale(.94); }
      h1,h2{ font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive; margin:0; line-height:1.15; }
      .bigtitle{ font-size:2.5rem; text-align:center; margin-top:16px; }
      .subtitle{ text-align:center; color:var(--ink-soft); font-size:1.05rem; line-height:1.5; margin:0; }
      .card{
        background:var(--card); border:2.5px solid var(--line);
        border-radius:18px 6px 20px 8px/8px 20px 6px 18px;
        box-shadow:var(--shadow); padding:14px;
      }
      .scene{ width:100%; height:auto; display:block; border-radius:10px; }
      .q{ font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive; font-size:1.45rem; text-align:center; margin:2px 0 0; }
      .hint{ text-align:center; color:var(--ink-soft); font-size:.95rem; margin:0; line-height:1.45; }
      .choices{ display:flex; flex-direction:column; gap:10px; }
      .choice{
        font-family:inherit; font-size:1.12rem; font-weight:600; color:var(--ink);
        background:var(--card); border:2.5px solid var(--line);
        border-radius:16px 5px 16px 5px/5px 16px 5px 16px;
        padding:15px 14px; cursor:pointer; text-align:center; min-height:56px;
        transition:transform .08s ease, background .15s ease;
      }
      .choice:active{ transform:scale(.97); }
      .choice.picked{ background:var(--accent-soft); border-color:var(--accent); }
      .choice:disabled{ opacity:.75; cursor:default; }
      .feedback{ min-height:1.5em; text-align:center; font-size:1rem; color:var(--teal); font-weight:600; line-height:1.45; margin:0; }
      .bigbtn{
        font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
        font-size:1.5rem; color:#fff; background:var(--accent);
        border:2.5px solid var(--line); border-radius:18px 6px 18px 6px;
        padding:14px 26px; cursor:pointer; box-shadow:var(--shadow); align-self:center;
      }
      .bigbtn:active{ transform:scale(.96); }
      .lvlbtn{
        font-family:inherit; text-align:left; width:100%; cursor:pointer;
        background:var(--card); border:2.5px solid var(--line);
        border-radius:18px 6px 20px 8px/8px 20px 6px 18px;
        box-shadow:var(--shadow); padding:16px 18px; color:var(--ink);
        display:flex; flex-direction:column; gap:3px;
      }
      .lvlbtn:active{ transform:scale(.98); }
      .lvlbtn .lname{ font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive; font-size:1.7rem; color:var(--accent); }
      .lvlbtn .lsub{ font-size:1rem; color:var(--ink); line-height:1.4; }
      .lvlbtn .lmeta{ font-size:.88rem; color:var(--ink-soft); }
      .lvlbtn .llast{ font-size:.92rem; color:var(--teal); font-weight:600; }
      .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .tile{
        background:var(--card); border:2.5px solid var(--line); border-radius:16px 6px 16px 6px;
        padding:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; min-height:104px;
      }
      .tile:active{ transform:scale(.96); }
      .tile.picked{ background:var(--accent-soft); border-color:var(--accent); }
      .tile.reveal{ border-color:var(--teal); border-width:3.5px; }
      .tile svg{ width:84px; height:84px; }
      .ctile{ min-height:118px; border-radius:16px 6px 16px 6px; }
      .duo{ display:flex; gap:10px; }
      .duo figure{ margin:0; flex:1; }
      .duo figcaption{ text-align:center; font-size:.9rem; color:var(--ink-soft); margin-top:4px; font-weight:600; }
      .stroop{ text-align:center; font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive; font-size:4rem; font-weight:700; letter-spacing:.06em; padding:22px 0 10px; }
      .stroop2w{ text-align:center; font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive; font-size:2.9rem; font-weight:700; letter-spacing:.05em; line-height:1.25; padding:14px 0 6px; }
      .bignum{ text-align:center; font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive; font-size:2.1rem; font-weight:700; letter-spacing:.04em; padding:20px 0 12px; }
      .seqrow{ display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; padding:10px 0 4px; }
      .seqcell{ width:52px; height:52px; border:2px dashed var(--ink-soft); border-radius:12px 4px 12px 4px; display:flex; align-items:center; justify-content:center; }
      .seqcell.full{ border-style:solid; border-color:var(--line); background:var(--card); }
      .seqcell svg{ width:36px; height:36px; }
      .grid3{ display:grid; grid-template-columns:repeat(3,64px); gap:8px; justify-content:center; padding:8px 0 2px; }
      .grid3 .seqcell{ width:64px; height:64px; }
      .shapebtns{ display:flex; gap:10px; justify-content:center; }
      .shapebtn{ width:76px; height:64px; background:var(--card); border:2.5px solid var(--line); border-radius:14px 5px 14px 5px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
      .shapebtn:active{ transform:scale(.95); }
      .shapebtn svg{ width:38px; height:38px; }
      .eyehero{ display:flex; justify-content:center; padding-top:10px; }
      .profilename{ font-size:2.1rem; text-align:center; color:var(--accent); }
      .profdesc{ font-size:1.05rem; line-height:1.6; text-align:center; margin:0; }
      .readhead{ font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive; font-size:1.25rem; color:var(--accent); margin:0 0 4px; }
      .readtxt{ font-size:1rem; line-height:1.55; margin:0 0 14px; }
      .readtxt:last-child{ margin-bottom:0; }
      .gauges{ display:flex; flex-direction:column; gap:16px; }
      .glabels{ display:flex; justify-content:space-between; font-size:.92rem; font-weight:700; margin-bottom:5px; }
      .gtrack{ position:relative; height:14px; border:2px solid var(--line); border-radius:99px; background:var(--paper); }
      .gcenter{ position:absolute; left:50%; top:-4px; bottom:-4px; width:2px; background:var(--ink-soft); opacity:.6; }
      .gmark{ position:absolute; top:50%; width:22px; height:22px; border-radius:50%; background:var(--accent); border:2.5px solid var(--line); transform:translate(-50%,-50%); transition:left .8s ease; }
      .honest{ text-align:center; color:var(--ink-soft); font-size:.9rem; line-height:1.5; margin:0; }
      body[data-level="jeunesse"] .choice{ font-size:1.3rem; padding:20px 14px; min-height:70px; }
      body[data-level="jeunesse"] .q{ font-size:1.7rem; }
      body[data-level="jeunesse"] .hint{ font-size:1.05rem; }
      body[data-level="jeunesse"] .tile{ min-height:124px; }
      body[data-level="jeunesse"] .tile svg{ width:100px; height:100px; }
      .fadein{ animation:fadein .35s ease both; }
      @keyframes fadein{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
      .pulse{ animation:pulse 1s ease infinite; transform-origin:center; transform-box:fill-box; }
      @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.18);} }
      .shake{ animation:shake .3s ease; }
      @keyframes shake{ 0%,100%{ transform:translateX(0);} 25%{ transform:translateX(-5px);} 75%{ transform:translateX(5px);} }
      @media (prefers-reduced-motion: reduce){
        .fadein,.pulse,.shake{ animation:none; }
        .gmark{ transition:none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="app"></div>

    <script>
    "use strict";
    /* ============ État du jeu ============ */
    var app = document.getElementById("app");
    var state = { idx: -1, level: null, a: 0, b: 0, c: 0, busy: false, startedAt: 0 };
    /* a : Détail(-) / Global(+)   b : Logique(-) / Intuition(+)   c : Réflexion(-) / Premier réflexe(+) */
    function bank(){ return state.level ? BANKS[state.level] : []; }

    /* ============ Sons doux 100 % WebAudio ============ */
    var audioCtx = null, soundOn = true;
    function ac(){
      if(!audioCtx){
        try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
      }
      if(audioCtx && audioCtx.state === "suspended"){ audioCtx.resume(); }
      return audioCtx;
    }
    function tone(freq, t0, dur, type, vol){
      var ctx = ac(); if(!ctx || !soundOn) return;
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      var t = ctx.currentTime + (t0 || 0);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    }
    function sndTap(){ tone(560, 0, 0.12, "triangle", 0.10); }
    function sndNext(){ tone(523, 0, 0.16, "sine", 0.10); tone(784, 0.09, 0.22, "sine", 0.09); }
    function sndFound(){ tone(880, 0, 0.14, "sine", 0.10); tone(1174, 0.08, 0.16, "sine", 0.10); tone(1568, 0.16, 0.26, "sine", 0.09); }
    function sndFinal(){ var n=[392,523,659,784,1046]; for(var i=0;i<n.length;i++){ tone(n[i], i*0.11, 0.3, "triangle", 0.10); } }

    /* ============ Utilitaires ============ */
    function shuffle(arr){
      var a = arr.slice();
      for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
      return a;
    }
    var LEVELMETA = {
      jeunesse: { name: "Jeunesse", sub: "Des images douces, de gros boutons, zéro pression.", meta: "12 petits défis · à ton rythme" },
      ado: { name: "Ado", sub: "Plus subtil, plus rapide. À toi de voir ce que tu vois.", meta: "14 défis · un peu plus corsé" },
      adulte: { name: "Adulte", sub: "Figure-fond, visages cachés, mémoire fine. Le complet.", meta: "16 défis · la grosse banque" }
    };
    function topbar(){
      var rounds = bank();
      var dots = "";
      if(state.level && state.idx >= 0){
        for(var i=0;i<rounds.length;i++){
          var cls = "dot";
          if(i < state.idx) cls += " done";
          else if(i === state.idx && state.idx < rounds.length) cls += " now";
          dots += '<span class="' + cls + '"></span>';
        }
      }
      var icon = soundOn
        ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.2 6a9 9 0 0 1 0 12"/></svg>'
        : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>';
      var left = state.level && state.idx >= 0
        ? '<span class="lvlname">' + LEVELMETA[state.level].name + '</span><div class="dots">' + dots + '</div>'
        : '<div class="dots">' + dots + '</div>';
      return '<div class="topbar">' + left +
        '<button class="sndbtn" id="sndBtn" aria-label="Son activé ou coupé">' + icon + '</button></div>';
    }
    function bindTop(){
      var b = document.getElementById("sndBtn");
      if(b){ b.addEventListener("click", function(){ soundOn = !soundOn; if(soundOn){ ac(); sndTap(); } render(); }); }
    }
    function timeAxis(){
      var dt = (performance.now() - state.startedAt) / 1000;
      if(dt < 2.5) state.c += 1;
      else if(dt > 7) state.c -= 1;
    }
    function applyScore(s){
      if(!s) return;
      if(s.a) state.a += s.a;
      if(s.b) state.b += s.b;
      if(s.c) state.c += s.c;
    }

      '<path d="M86,24 C95,37 97,46 86,57 C75,46 77,37 86,24 Z" fill="#f6a83c" stroke="' + INK + '" stroke-width="2.5"/>' +
      '<path d="M86,38 C90,44 90,49 86,53 C82,49 82,44 86,38 Z" fill="#ffd97a"/>' +

    function pickProfileKey(){
      var a = state.a, b = state.b, c = state.c;
      if(b <= -2 && c <= -1) return "stratege";
      if(a <= -2 && (b <= -1 || c <= -1)) return "detective";
      if(a >= 2 && b >= 1) return "reveur";
      if(a <= -3) return "detective";
      if(b >= 3 && a >= 0) return "reveur";
      if(b <= -3) return "stratege";
      return "explorateur";
    }

    /* ============ Navigation ============ */
    function render(){
      if(state.idx < 0){ renderStart(); return; }
      var rounds = bank();
      if(state.idx >= rounds.length){ renderFinal(); return; }
      var r = rounds[state.idx];
      state.busy = false;
      state.startedAt = performance.now();
      if(r.type === "choix" || r.type === "compte") renderChoix(r);
      else if(r.type === "cache") renderCache(r);
      else if(r.type === "suite") renderSuite(r);
      else if(r.type === "flash") renderFlash(r);
      else if(r.type === "estimation") renderEstimation();
      else if(r.type === "intrus") renderIntrus(r);
      else if(r.type === "stroop") renderStroop();
      else if(r.type === "stroopComplet") renderStroopComplet();
      else if(r.type === "motif" || r.type === "complete") renderMotif(r);
      else if(r.type === "motifDir") renderMotifDir(r);
      else if(r.type === "change") renderChange(r);
      else if(r.type === "memoire") renderMemoire(r);
      else if(r.type === "nuance") renderNuance(r);
      else if(r.type === "suiteNombres") renderSuiteNombres(r);
      bindTop();
    }
    function next(){
      state.idx += 1;
      render();
      window.scrollTo(0, 0);
    }
    function finish(feedbackText, soundFn){
      if(state.busy) return;
      state.busy = true;
      var fb = document.getElementById("fb");
      if(fb) fb.textContent = feedbackText || "";
      if(soundFn) soundFn(); else sndNext();
      setTimeout(next, state.level === "jeunesse" ? 2100 : 1800);
    }
    function choicesHTML(choices){
      var h = '<div class="choices">';
      for(var i=0;i<choices.length;i++){
        h += '<button class="choice" data-i="' + i + '">' + choices[i].t + '</button>';
      }
      return h + '</div><p class="feedback" id="fb"></p>';
    }
    function bindChoices(r){
      var btns = app.querySelectorAll(".choice");
      for(var i=0;i<btns.length;i++){
        btns[i].addEventListener("click", function(){
          if(state.busy) return;
          var c = r.choices[parseInt(this.getAttribute("data-i"), 10)];
          this.classList.add("picked");
          var all = app.querySelectorAll(".choice");
          for(var j=0;j<all.length;j++) all[j].disabled = true;
          sndTap(); applyScore(c.s); timeAxis();
          finish(r.fb);
        });
      }
    }

    /* ============ Objet caché ============ */
    function renderCache(r){
      state.cacheMisses = 0;
      app.innerHTML = topbar() +
        '<div class="card fadein">' + r.svg + '</div>' +
        '<p class="q">' + r.q + '</p>' +
        '<p class="hint">' + r.hint + '</p>' +
        '<p class="feedback" id="fb"></p>';
      var svg = document.getElementById(r.svgId);
      if(!svg) return;
      svg.addEventListener("click", function(ev){
        if(state.busy) return;
        if(ev.target && ev.target.classList && ev.target.classList.contains("hotspot")){
          applyScore({ a: -2 }); timeAxis();
          var key = document.getElementById("theKey");
          if(key) key.classList.add("pulse");
          finish(r.fbFound, sndFound);
        } else {
          state.cacheMisses += 1;
          sndTap();
          svg.classList.remove("shake"); void svg.offsetWidth; svg.classList.add("shake");
          var fb = document.getElementById("fb");
          if(state.cacheMisses === 2) fb.textContent = r.hints[0];
          else if(state.cacheMisses >= 4) fb.textContent = r.hints[1];
          else fb.textContent = state.level === "jeunesse" ? "Pas là… cherche encore, tu vas le trouver !" : "Raté ! C'est bien caché.";
        }
      });
    }

    /* ============ Flash d'étoiles / estimation de points ============ */
    function starField(n){

    function renderEstimation(){

          for(var j=0;j<placed.length;j++){

      h += '</div>';
      app.innerHTML = topbar() +
        '<p class="q">Quatre tuiles bleues. Une seule n\'a pas exactement la même teinte…</p>' +
        '<p class="hint">Touche celle qui te semble un tout petit peu différente.</p>' +
        h + '<p class="feedback" id="fb"></p>';
      bindTop();
      var btns = app.querySelectorAll(".tile");
      for(var j=0;j<btns.length;j++){
        btns[j].addEventListener("click", function(){
          if(state.busy) return;
          var ok = this.getAttribute("data-ok") === "1";
          this.classList.add("picked");
          var all = app.querySelectorAll(".tile");
          for(var m=0;m<all.length;m++){ if(all[m].getAttribute("data-ok") === "1") all[m].classList.add("reveal"); }
          sndTap();
          if(ok) applyScore({ a: -2, b: -1 }); else applyScore({ b: 1 });
          timeAxis();
          finish(ok ? "C'est elle : un rien plus pâle. Il fallait l'œil fin." : "C'était celle entourée en vert : un rien plus pâle que les autres.");
        });
      }
    }

    /* ============ Profils sauvegardés, par niveau ============ */
    function lastProfile(level){
      try{
        var raw = localStorage.getItem("queVoisTuProfil_" + level);
        if(!raw) return null;
        var p = JSON.parse(raw);
        return p && p.type ? p : null;
      }catch(e){ return null; }
    }

    /* ============ Écran de départ : le choix du public ============ */
    function renderStart(){
      document.body.removeAttribute("data-level");
      var eye = '<svg width="120" height="84" viewBox="0 0 120 84"><path d="M6,42 C26,12 94,12 114,42 C94,72 26,72 6,42 Z" fill="#fffdf6" stroke="' + INK + '" stroke-width="3.5"/><circle cx="60" cy="42" r="17" fill="#2e7d74" stroke="' + INK + '" stroke-width="3"/><circle cx="60" cy="42" r="7" fill="' + INK + '"/><circle cx="66" cy="36" r="3.5" fill="#ffffff"/></svg>';
      var keys = ["jeunesse", "ado", "adulte"];
      var btns = "";
      for(var i=0;i<keys.length;i++){
        var m = LEVELMETA[keys[i]];
        var last = lastProfile(keys[i]);
        btns += '<button class="lvlbtn" data-lvl="' + keys[i] + '">' +
          '<span class="lname">' + m.name + '</span>' +
          '<span class="lsub">' + m.sub + '</span>' +
          '<span class="lmeta">' + m.meta + '</span>' +
          (last ? '<span class="llast">La dernière fois : ' + last.type + '</span>' : '') +
        '</button>';
      }
      app.innerHTML = topbar() +
        '<div class="eyehero">' + eye + '</div>' +
        '<h1 class="bigtitle">Que vois-tu ?</h1>' +
        '<p class="subtitle">Un petit jeu d\'images et de coups d\'œil.<br/>Réponds ce qui te vient en premier —<br/>il n\'y a pas de mauvaise réponse.<br/>Choisis ton terrain de jeu :</p>' +
        btns +
        '<p class="hint">42 images et défis en tout, dessinés juste pour ce jeu. À la fin de chaque partie, une petite surprise t\'attend…</p>';
      bindTop();
      var els = app.querySelectorAll(".lvlbtn");
      for(var j=0;j<els.length;j++){
        els[j].addEventListener("click", function(){
          var lvl = this.getAttribute("data-lvl");
          ac(); sndNext();
          state.level = lvl;
          document.body.setAttribute("data-level", lvl);
          state.idx = 0; state.a = 0; state.b = 0; state.c = 0;
          render();
          window.scrollTo(0, 0);
        });
      }
    }

    /* ============ Profil final ============ */
    function gaugeHTML(leftLabel, rightLabel, val){
      var norm = Math.max(-1, Math.min(1, val / 12));
      var pct = 50 + norm * 44;
      return '<div><div class="glabels"><span>' + leftLabel + '</span><span>' + rightLabel + '</span></div>' +
        '<div class="gtrack"><div class="gcenter"></div><div class="gmark" style="left:' + pct + '%"></div></div></div>';
    }
    function renderFinal(){
      var key = pickProfileKey();
      var p = PROFILES[state.level][key];
      try{ localStorage.setItem("queVoisTuProfil_" + state.level, JSON.stringify({ type: p.name, date: new Date().toISOString() })); }catch(e){}
      sndFinal();
      var lecture = "";
      if(p.lecture){
        lecture = '<div class="card fadein">';
        for(var i=0;i<p.lecture.length;i++){
          lecture += '<p class="readhead">' + p.lecture[i].h + '</p><p class="readtxt">' + p.lecture[i].t + '</p>';
        }
        lecture += '</div>';
      }
      app.innerHTML = topbar() +
        '<h2 style="text-align:center;font-size:1.5rem;margin-top:8px">Ton profil de joueur</h2>' +
        '<div class="card fadein">' +
          '<h2 class="profilename">' + p.name + '</h2>' +
          '<p class="profdesc">' + p.desc + '</p>' +
        '</div>' +
        '<div class="card fadein"><div class="gauges">' +
          gaugeHTML("Détail", "Global", state.a) +
          gaugeHTML("Logique", "Intuition", state.b) +
          gaugeHTML("Réflexion", "Premier réflexe", state.c) +
        '</div></div>' +
        lecture +
        '<p class="honest">Un profil de joueur, pour le plaisir — ceci n\'est pas un test médical. Tes réponses dessinent un style de regard, pas un score.</p>' +
        '<button class="bigbtn" id="againBtn">Rejouer</button>';
      bindTop();
      document.getElementById("againBtn").addEventListener("click", function(){
        sndTap();
        state.idx = -1; state.level = null; state.a = 0; state.b = 0; state.c = 0;
        renderStart(); bindTop();
        window.scrollTo(0, 0);
      });
      /* Petite animation des jauges */
      var marks = app.querySelectorAll(".gmark");
      var targets = [];
      for(var i=0;i<marks.length;i++){ targets.push(marks[i].style.left); marks[i].style.left = "50%"; }
      setTimeout(function(){
        for(var j=0;j<marks.length;j++) marks[j].style.left = targets[j];
      }, 60);
    }

    /* ============ Démarrage ============ */
    state.idx = -1;
    renderStart();
    bindTop();
    </script>
