<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>L'hydroélectricité, comment ça marche</title>
    <style>
      :root{
        --paper:#f6f1e3; --card:#fffdf4; --ink:#20313b; --ink-soft:#4a5f6a;
        --line:#20313b; --water:#2e7fb8; --deep:#14506e; --teal:#177e70;
        --energy:#e8930c; --energy-soft:#fbd38d; --good:#2f9e5f; --bad:#d9534f;
        --copper:#b87333; --sky:#bfe3f2; --shadow:0 3px 0 rgba(32,49,59,.9);
        --radius:14px;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --paper:#12212c; --card:#1b3040; --ink:#eef4f1; --ink-soft:#b9cdc9;
          --line:#d8e6e2; --water:#4aa3d8; --deep:#7cc0e8; --teal:#3bbfa9;
          --energy:#f5a623; --energy-soft:#8a5f14; --good:#4cc47c; --bad:#e07a76;
          --copper:#d99a55; --sky:#274b61; --shadow:0 3px 0 rgba(0,0,0,.55);
        }
      }
      *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
      html,body{margin:0;padding:0;}
      body{
        background:var(--paper); color:var(--ink);
        font-family:"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif;
        line-height:1.45; padding:10px 10px 34px;
      }
      #app{max-width:560px;margin:0 auto;}
      h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.15;margin:0;}
      button{font-family:inherit;cursor:pointer;}
      .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px;}
      .dots{display:flex;gap:5px;flex-wrap:wrap;}
      .dot{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;background:var(--card);}
      .dot.done{background:var(--teal);color:#fff;border-color:var(--line);}
      .dot.now{background:var(--energy);color:#fff;transform:scale(1.12);}
      .sonbtn{border:2.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem;box-shadow:var(--shadow);}
      .sonbtn:active{transform:translateY(2px);box-shadow:none;}
      .card{background:var(--card);border:3px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
      .hero{text-align:center;padding:22px 16px 18px;}
      .hero h1{font-size:1.72rem;margin:8px 0 6px;}
      .hero p{color:var(--ink-soft);margin:6px auto;max-width:44ch;}
      .bigtitle{font-size:1.35rem;}
      .kicker{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.78rem;color:var(--deep);}
      @media (prefers-color-scheme: dark){.kicker{color:var(--water);}}
      .btn{
        display:inline-block;border:3px solid var(--line);border-radius:12px;background:var(--energy);
        color:#fff;font-weight:800;font-size:1.05rem;padding:12px 20px;box-shadow:var(--shadow);
        text-shadow:0 1px 0 rgba(0,0,0,.25);min-height:52px;
      }
      .btn:active{transform:translateY(2px);box-shadow:none;}
      .btn:disabled{opacity:.45;cursor:default;}
      .btn.second{background:var(--card);color:var(--ink);text-shadow:none;}
      .btn.teal{background:var(--teal);}
      .btn.big{width:100%;font-size:1.15rem;padding:15px;}
      .btn.hold{user-select:none;-webkit-user-select:none;touch-action:none;}
      .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
      .btnrow .btn{flex:1 1 140px;}
      .guide{display:flex;gap:10px;align-items:flex-start;}
      .guide .face{flex:0 0 62px;}
      .bubble{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:10px 12px;position:relative;flex:1;box-shadow:var(--shadow);}
      .bubble:before{content:"";position:absolute;left:-13px;top:22px;border:7px solid transparent;border-right:9px solid var(--line);}
      .bubble b{color:var(--deep);}
      @media (prefers-color-scheme: dark){.bubble b{color:var(--water);}}
      .scene{border:3px solid var(--line);border-radius:var(--radius);overflow:hidden;background:linear-gradient(180deg,#aedcf0 0%,#d8f0e4 78%,#cdeac9 100%);box-shadow:var(--shadow);margin-bottom:12px;}
      .scene svg{display:block;width:100%;height:auto;}
      .gauge{margin:10px 0;}
      .gauge .glabel{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem;margin-bottom:4px;}
      .gtrack{height:22px;border:3px solid var(--line);border-radius:999px;background:var(--card);position:relative;overflow:hidden;}
      .gfill{height:100%;width:0%;background:var(--water);transition:width .18s ease;}
      .gfill.energy{background:var(--energy);}
      .gfill.good{background:var(--good);}
      .gzone{position:absolute;top:0;bottom:0;background:rgba(47,158,95,.35);border-left:2.5px dashed var(--good);border-right:2.5px dashed var(--good);}
      input[type=range]{width:100%;height:44px;accent-color:var(--water);cursor:pointer;}
      .msg{border:3px dashed var(--teal);border-radius:12px;padding:10px 12px;background:rgba(23,126,112,.08);font-weight:600;margin:12px 0;}
      .msg.warn{border-color:var(--energy);background:rgba(232,147,12,.10);}
      .qbtn{display:block;width:100%;text-align:left;border:3px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:1.02rem;font-weight:700;padding:14px;margin:8px 0;box-shadow:var(--shadow);min-height:52px;}
      .qbtn:active{transform:translateY(2px);box-shadow:none;}
      .qbtn.good{background:var(--good);color:#fff;}
      .qbtn.bad{background:var(--bad);color:#fff;}
      .factcard{background:var(--card);border:3px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 16px;text-align:center;}
      .factcard .facttitle{font-family:Georgia,serif;font-size:1.5rem;color:var(--deep);margin:6px 0 10px;}
      @media (prefers-color-scheme: dark){.factcard .facttitle{color:var(--water);}}
      .factcard p{font-size:1.08rem;max-width:46ch;margin:0 auto 14px;}
      .starsline{font-size:1.25rem;letter-spacing:.15em;color:var(--energy);}
      .namein{width:100%;font-size:1.1rem;padding:12px;border:3px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit;font-weight:700;text-align:center;}
      label.flabel{display:block;font-weight:700;margin:12px 0 6px;text-align:left;}
      .stationlist{list-style:none;margin:10px 0;padding:0;text-align:left;}
      .stationlist li{display:flex;justify-content:space-between;gap:8px;padding:7px 2px;border-bottom:2px dotted var(--ink-soft);}
      .stationlist li:last-child{border-bottom:none;}
      .diploma{border:4px double var(--line);border-radius:10px;padding:22px 16px;text-align:center;background:var(--card);}
      .diploma h2{font-size:1.55rem;margin:4px 0;}
      .diploma .nom{font-family:Georgia,serif;font-size:1.5rem;color:var(--deep);font-style:italic;}
      @media (prefers-color-scheme: dark){.diploma .nom{color:var(--water);}}
      .honnete{font-size:.92rem;color:var(--ink-soft);text-align:center;margin:14px auto;max-width:48ch;}
      .voltbig{font-family:Georgia,serif;font-size:2rem;font-weight:700;text-align:center;color:var(--deep);margin:6px 0;}
      @media (prefers-color-scheme: dark){.voltbig{color:var(--energy);}}
      .wattline{display:flex;justify-content:space-between;border-bottom:2px dotted var(--ink-soft);padding:6px 2px;font-weight:600;}
      .pulse-ring{animation:pring 1s ease-in-out infinite;}
      @keyframes pring{0%,100%{opacity:.25}50%{opacity:1}}
      .bob{animation:bob 2.2s ease-in-out infinite;}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @media (prefers-reduced-motion: reduce){.bob,.pulse-ring,.starsline.pop{animation:none;}}
      .center{text-align:center;}
      .small{font-size:.9rem;color:var(--ink-soft);}
      .hidden{display:none !important;}
      .dot.done{cursor:pointer;}
      .starsline.pop{animation:popstar .55s ease;}
      @keyframes popstar{0%{transform:scale(.4)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
      @keyframes cfall{to{transform:translateY(106vh) rotate(320deg);opacity:.1}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
    "use strict";
    /* ============ ÉTAT + SAUVEGARDE ============ */
    var SAVE_KEY = "hydro-visite-v1";
    var save = { name: "Pluie", stars: {}, best: null };
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (raw) { var p = JSON.parse(raw); if (p && p.stars) save = p; }
    } catch (e) {}
    function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
    function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
    var S = { station: 0, runStars: {}, raf: null, timers: [], humOsc: null, humGain: null, t0: null };
    function stopLoops() {
      if (S.raf) cancelAnimationFrame(S.raf); S.raf = null;
      S.timers.forEach(function (t) { clearInterval(t); clearTimeout(t); });
      S.timers = []; stopHum();
    }
    function later(fn, ms) { var t = setTimeout(fn, ms); S.timers.push(t); return t; }
    function every(fn, ms) { var t = setInterval(fn, ms); S.timers.push(t); return t; }
    function $(s, r) { return (r || document).querySelector(s); }
    function totalStars(stars) { var t = 0; for (var k in stars) t += stars[k]; return t; }
    function starStr(n) { var s = ""; for (var i = 0; i < 2; i++) s += (i < n ? "★" : "☆"); return s; }

    /* ============ SONS WebAudio (100 % synthétisés) ============ */
    var AC = null, soundOn = true;
    function ac() {
      if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
      if (AC && AC.state === "suspended") AC.resume();
      return AC;
    }
    function tone(freq, dur, type, vol, slideTo, delay) {
      if (!soundOn) return; var c = ac(); if (!c) return;
      var t0 = c.currentTime + (delay || 0);
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.05);
    }
    function waterSound(dur) {
      if (!soundOn) return; var c = ac(); if (!c) return;
      dur = dur || 0.7;
      var len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = c.createBufferSource(); src.buffer = buf;
      var f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 700;
      var g = c.createGain(); g.gain.value = 0.16;
      src.connect(f); f.connect(g); g.connect(c.destination); src.start();
    }
    function startHum(base) {
      if (!soundOn || S.humOsc) return; var c = ac(); if (!c) return;
      try {
        S.humOsc = c.createOscillator(); S.humGain = c.createGain();
        S.humOsc.type = "sawtooth"; S.humOsc.frequency.value = base || 55;
        var f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 220;
        S.humGain.gain.value = 0.0;
        S.humOsc.connect(f); f.connect(S.humGain); S.humGain.connect(c.destination);
        S.humOsc.start();
      } catch (e) {}
    }
    function setHum(level, freq) {
      if (S.humGain && AC) { try {
        S.humGain.gain.setTargetAtTime(Math.min(0.14, level), AC.currentTime, 0.08);
        if (freq && S.humOsc) S.humOsc.frequency.setTargetAtTime(freq, AC.currentTime, 0.08);
      } catch (e) {} }
    }
    function stopHum() {
      if (S.humOsc) { try { S.humOsc.stop(); } catch (e) {} S.humOsc = null; S.humGain = null; }
    }
    function sndClick() { tone(620, 0.07, "triangle", 0.08); }
    function sndGood() { tone(523, 0.14, "sine", 0.12); tone(659, 0.14, "sine", 0.12, null, 0.1); tone(784, 0.22, "sine", 0.13, null, 0.2); }
    function sndZap() { tone(1200, 0.16, "square", 0.05, 300); tone(180, 0.1, "sawtooth", 0.05); }
    function sndDing() { tone(880, 0.18, "sine", 0.1); tone(1320, 0.25, "sine", 0.08, null, 0.08); }

    /* ============ PERSONNAGES SVG ============ */
    function guideSVG(cls) {
      return '<svg class="' + (cls || "") + '" viewBox="0 0 80 96" width="62" height="75" aria-hidden="true">'
        + '<circle cx="40" cy="34" r="17" fill="#f2c79b" stroke="#20313b" stroke-width="3"/>'
        + '<path d="M22 32 a18 15 0 0 1 36 0 l0 4 -36 0 z" fill="#f5a623" stroke="#20313b" stroke-width="3"/>'
        + '<rect x="18" y="34" width="44" height="5" rx="2" fill="#f5a623" stroke="#20313b" stroke-width="2.5"/>'
        + '<path d="M24 30 q-3 14 2 20 M56 30 q3 14 -2 20" stroke="#6b4226" stroke-width="5" fill="none" stroke-linecap="round"/>'
        + '<circle cx="34" cy="36" r="2.2" fill="#20313b"/><circle cx="46" cy="36" r="2.2" fill="#20313b"/>'
        + '<path d="M34 44 q6 5 12 0" stroke="#20313b" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
        + '<path d="M26 58 L54 58 L58 92 L22 92 Z" fill="#177e70" stroke="#20313b" stroke-width="3"/>'
        + '<path d="M31 58 L40 74 L49 58" fill="#fffdf4" stroke="#20313b" stroke-width="2.5"/>'
        + '<rect x="36" y="76" width="8" height="10" fill="#e8930c" stroke="#20313b" stroke-width="2"/>'
        + '</svg>';
    }
    function dropSVG(size, mood) {
      var mouth = mood === "tired" ? '<path d="M34 62 q6 -4 12 0" stroke="#20313b" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
        : '<path d="M33 58 q7 7 14 0" stroke="#20313b" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      var eyes = mood === "tired"
        ? '<path d="M28 50 l8 0 M44 50 l8 0" stroke="#20313b" stroke-width="2.5" stroke-linecap="round"/>'
        : '<circle cx="32" cy="50" r="3" fill="#20313b"/><circle cx="48" cy="50" r="3" fill="#20313b"/>';
      return '<svg viewBox="0 0 80 96" width="' + size + '" height="' + Math.round(size * 1.2) + '" aria-hidden="true">'
        + '<path d="M40 6 C40 6 14 40 14 60 a26 26 0 0 0 52 0 C66 40 40 6 40 6 Z" fill="#4aa3d8" stroke="#20313b" stroke-width="3.5"/>'
        + '<ellipse cx="30" cy="58" rx="6" ry="9" fill="#bfe3f2" opacity="0.8"/>'
        + eyes + mouth + '</svg>';
    }
    function boltSVG(size, color) {
      return '<svg viewBox="0 0 40 64" width="' + size + '" height="' + Math.round(size * 1.6) + '" aria-hidden="true">'
        + '<path d="M24 2 L6 36 L17 36 L12 62 L34 26 L22 26 Z" fill="' + (color || "#f5a623") + '" stroke="#20313b" stroke-width="3" stroke-linejoin="round"/></svg>';
    }

    /* ============ CHROME COMMUN ============ */
    var STATION_TITLES = [
      "Le barrage et le réservoir", "La conduite forcée", "La turbine",
      "L'alternateur", "Le transformateur", "Les lignes de transport", "Jusqu'à ta maison"
    ];
    var OBJECTIFS = [
      "Ouvre les vannes et laisse l'eau partir en douceur, sans vider le réservoir.",
      "Fais dévaler ta goutte jusqu'en bas de la conduite forcée.",
      "Fais tourner la turbine et garde sa vitesse dans la zone verte.",
      "Fais tourner les aimants jusqu'à environ 60 hertz, et tiens le rythme.",
      "Monte la tension jusqu'à 735 000 volts, puis compare les pertes des deux voyages.",
      "Guide l'éclair de pylône en pylône, jusqu'à la ville.",
      "Abaisse la tension en deux crans, puis branche les trois appareils."
    ];
    function topbarHTML(active) {
      var dots = "";
      for (var i = 1; i <= 7; i++) {
        var done = (save.stars[i] || 0) > 0 || (S.runStars[i] && (S.runStars[i].jeu || S.runStars[i].q));
        if (done && i !== active) {
          dots += '<button type="button" class="dot done" data-i="' + i + '" aria-label="Revoir la station ' + i + '" style="font-family:inherit">' + i + "</button>";
        } else {
          dots += '<div class="dot' + (i === active ? " now" : (done ? " done" : "")) + '" data-i="' + i + '">' + i + "</div>";
        }
      }
      return '<div class="topbar"><div class="dots">' + dots + '</div>'
        + '<button class="sonbtn" id="sonBtn" type="button">' + (soundOn ? "Son : marche" : "Son : arrêt") + "</button></div>";
    }
    function wireTopbar(active) {
      var b = $("#sonBtn");
      if (b) b.addEventListener("click", function () {
        soundOn = !soundOn; if (!soundOn) stopHum();
        b.textContent = soundOn ? "Son : marche" : "Son : arrêt";
        if (soundOn) sndClick();
      });
      document.querySelectorAll(".dot").forEach(function (d) {
        var i = parseInt(d.getAttribute("data-i"), 10);
        var doneIt = (save.stars[i] || 0) > 0 || (S.runStars[i] && (S.runStars[i].jeu || S.runStars[i].q));
        if (i && i !== active && doneIt) {
          d.title = "Revoir la station " + i;
          d.addEventListener("click", function () { sndClick(); if (S.t0 == null) S.t0 = performance.now(); stopLoops(); STATION_FNS[i - 1](); });
        }
      });
    }
    function holdKeys(btn) {
      if (!btn) return;
      btn.addEventListener("keydown", function (e) {
        if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); btn.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true })); }
      });
      btn.addEventListener("keyup", function (e) {
        if (e.key === " " || e.key === "Enter") { e.preventDefault(); btn.dispatchEvent(new PointerEvent("pointerup", { bubbles: true })); }
      });
      btn.addEventListener("blur", function () { btn.dispatchEvent(new PointerEvent("pointerup", { bubbles: true })); });
    }
    function guideBubble(texte) {
      return '<div class="guide"><div class="face">' + guideSVG() + '</div><div class="bubble">' + texte + "</div></div>";
    }
    function stationHead(n, sousTitre) {
      return topbarHTML(n)
        + '<div class="card"><p class="kicker">Station ' + n + " sur 7 — centrale de la rivière aux Saumons</p>"
        + "<h2 class='bigtitle'>" + STATION_TITLES[n - 1] + "</h2>"
        + (sousTitre ? '<p class="small" style="margin:6px 0 0">' + sousTitre + "</p>" : "")
        + '<p style="margin:8px 0 0"><b>Ton objectif :</b> ' + OBJECTIFS[n - 1] + "</p></div>";
    }
    function award(n, kind) {
      if (!S.runStars[n]) S.runStars[n] = { jeu: false, q: false };
      S.runStars[n][kind] = true;
      var total = (S.runStars[n].jeu ? 1 : 0) + (S.runStars[n].q ? 1 : 0);
      if (total > (save.stars[n] || 0)) { save.stars[n] = total; persist(); }
    }
    function stationStarsHTML(n) {
      var t = (S.runStars[n] && S.runStars[n].jeu ? 1 : 0) + (S.runStars[n] && S.runStars[n].q ? 1 : 0);
      return '<span class="starsline pop">' + starStr(t) + "</span>";
    }

    /* ============ QUESTIONS + FAITS ============ */
    var QUESTIONS = [
      { q: "L'eau retenue en hauteur derrière le barrage, c'est comme…",
        opts: ["Une batterie géante, pleine d'énergie en réserve", "De l'eau qui ne sert à rien", "Un lac qui sert seulement aux bateaux et aux poissons"],
        bonne: 0, expl: "Exactement ! Gardée en hauteur, l'eau possède une énergie de position : elle n'attend qu'à descendre pour travailler." },
      { q: "Qu'est-ce qui rend l'eau de plus en plus rapide dans la conduite forcée ?",
        opts: ["Un moteur caché dans le tuyau qui pousse l'eau", "La hauteur de la chute : plus elle tombe de haut, plus elle arrive vite et fort", "La couleur du tuyau"],
        bonne: 1, expl: "Oui ! La hauteur de chute compte autant que la quantité d'eau. En tombant, l'eau transforme sa hauteur en vitesse." },
      { q: "La turbine transforme le mouvement de l'eau en…",
        opts: ["Rotation, comme une grande roue qui tourne", "Chaleur pour réchauffer la rivière", "Lumière pour éclairer la centrale"],
        bonne: 0, expl: "Bravo ! L'eau pousse les aubes, la roue tourne : c'est devenu un mouvement mécanique de rotation." },
      { q: "Dans l'alternateur, l'électricité naît grâce à…",
        opts: ["Des piles cachées dans la machine", "Des aimants qui tournent tout près de bobines de fil de cuivre", "Le frottement de l'eau dans les tuyaux"],
        bonne: 1, expl: "C'est ça ! Le va-et-vient des aimants devant le cuivre fait naître un courant qui complète 60 allers-retours par seconde : c'est le 60 hertz." },
      { q: "Pourquoi transporter l'électricité à très haute tension, comme 735 000 volts ?",
        opts: ["Pour perdre beaucoup moins d'énergie en route", "Pour faire chauffer les fils et fondre la neige", "Pour que l'électricité voyage plus vite que la lumière"],
        bonne: 0, expl: "Bien vu ! À haute tension, le même voyage coûte presque rien en pertes. À basse tension, les fils chaufferaient pour rien." },
      { q: "À quelle vitesse l'électricité voyage-t-elle dans les fils ?",
        opts: ["À la vitesse d'un bon vélo", "Presque à la vitesse de la lumière : c'est quasi instantané", "À la vitesse du son, comme le tonnerre après l'éclair"],
        bonne: 1, expl: "Oui ! Quand tu ouvres l'interrupteur, la lumière s'allume tout de suite, même si la centrale est à des centaines de kilomètres." },

      stopLoops(); S.station = 7;
      var scene = '<svg viewBox="0 0 360 240" role="img" aria-label="Un poteau avec un transformateur, et une maison dont les appareils s\'allument">'
        + '<rect x="34" y="60" width="10" height="150" fill="#8a6b48" stroke="#20313b" stroke-width="2.5"/>'
        + '<rect x="16" y="56" width="46" height="8" fill="#8a6b48" stroke="#20313b" stroke-width="2"/>'
        + '<rect id="s7can" x="48" y="66" width="30" height="40" rx="7" fill="#aeb9be" stroke="#20313b" stroke-width="3"/>'
        + '<path d="M62 56 C 130 30, 220 34, 300 52" stroke="#20313b" stroke-width="3" fill="none"/>'
        + '<path d="M62 106 C 120 130, 170 120, 196 96" stroke="#20313b" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/>'
        + '<text x="6" y="46" font-size="12" font-weight="700" fill="#20313b">Le transformateur du poteau</text>'
        + '<rect x="196" y="92" width="150" height="118" fill="#f2d38a" stroke="#20313b" stroke-width="3.5"/>'
        + '<polygon points="186,92 271,52 356,92" fill="#b3543f" stroke="#20313b" stroke-width="3.5"/>'
        + '<rect x="252" y="152" width="34" height="58" fill="#8a6b48" stroke="#20313b" stroke-width="2.5"/>'
        + '<circle id="s7glow" cx="226" cy="122" r="17" fill="#ffd94d" opacity="0"/>'
        + '<circle id="s7bulb" cx="226" cy="122" r="10" fill="#c8d2d6" stroke="#20313b" stroke-width="2.5"/>'
        + '<path d="M226 104 v8 M214 112 l5 5 M238 112 l-5 5" stroke="#20313b" stroke-width="2.5"/>'
        + '<rect id="s7frigo" x="300" y="118" width="30" height="56" rx="4" fill="#c8d2d6" stroke="#20313b" stroke-width="2.5"/>'
        + '<line x1="300" y1="140" x2="330" y2="140" stroke="#20313b" stroke-width="2"/>'
        + '<rect id="s7frigolight" x="306" y="146" width="8" height="8" fill="#7d8a91"/>'
        + '<rect id="s7heat" x="206" y="186" width="62" height="14" rx="4" fill="#c8d2d6" stroke="#20313b" stroke-width="2.5"/>'
        + '<path id="s7waves" d="M216 178 q4 -7 0 -13 M236 178 q4 -7 0 -13 M256 178 q4 -7 0 -13" stroke="#d9534f" stroke-width="3" fill="none" opacity="0" stroke-linecap="round"/>'
        + '<text x="196" y="228" font-size="12" font-weight="700" fill="#20313b">Ampoule — Frigo — Chauffage</text>'
        + "</svg>";
      var controls = '<h3>Étape 1 : abaisse la tension</h3>'
        + '<p>735 000 volts dans une prise de maison ? Beaucoup trop fort ! La tension descend en <b>deux crans</b> : d\'abord le poste de distribution (souvent vers <b>25 000 volts</b>, pour alimenter tout le quartier), puis le petit transformateur du poteau, jusqu\'à <b>120/240 volts</b> — la bonne « pression » pour la maison. Appuie deux fois pour descendre les deux crans !</p>'
        + '<div class="voltbig" id="s7volt">735 000 volts</div>'
        + '<button class="btn big" id="s7down" type="button">Abaisse la tension (premier cran)</button>'
        + '<div id="s7apps" class="hidden">'
        + '<h3 style="margin-top:18px">Étape 2 : branche les appareils</h3>'
        + '<p>Touche chaque appareil pour le brancher, et regarde combien d\'énergie il boit. L\'unité s\'appelle le <b>watt</b> — comme la « soif » de l\'appareil.</p>'
        + '<div class="btnrow" style="flex-direction:column">'
        + '<button class="btn second" data-app="ampoule" type="button">Brancher : l\'ampoule (environ 10 watts)</button>'
        + '<button class="btn second" data-app="frigo" type="button">Brancher : le réfrigérateur (environ 150 watts)</button>'
        + '<button class="btn second" data-app="chauffage" type="button">Brancher : le chauffage (environ 1 500 watts)</button>'
        + "</div>"
        + '<div class="wattline"><span>Total de la maison</span><span id="s7total">0 watt</span></div>'
        + '<p class="small">Et le <b>kilowattheure</b>, sur la facture ? C\'est simplement l\'énergie utilisée avec le temps : un appareil de 1 000 watts qui marche une heure consomme 1 kilowattheure.</p>'
        + "</div>";
      $("#app").innerHTML = stLayout(7, "Dernière étape : la bonne tension, puis la lumière !",
        "<b>Nadia :</b> On y est presque ! En chemin, un <b>poste de distribution</b> a déjà abaissé la tension des grandes lignes pour le quartier. Il reste le dernier cran : le petit baril gris sur le poteau, c'est un <b>transformateur</b> — le frère de celui de la station 5, mais il fait le travail inverse : il <b>abaisse</b> la tension pour qu'elle soit douce et sécuritaire dans la maison.",
        scene, controls);
      wireTopbar(7);
      var total = 0, branches = 0;
      var s7cran = 0;
      $("#s7down").addEventListener("click", function () {
        sndZap();
        if (s7cran === 0) {
          s7cran = 1; buzz(20);
          $("#s7volt").textContent = "25 000 volts — la tension du quartier";
          this.textContent = "Deuxième cran : le transformateur du poteau";
          return;
        }
        this.disabled = true;
        $("#s7volt").textContent = "120 / 240 volts — parfait pour la maison";
        $("#s7can").setAttribute("fill", "#f5a623");
        $("#s7apps").classList.remove("hidden");
        $("#s7apps").scrollIntoView({ behavior: "smooth", block: "center" });
      });
      var WATTS = { ampoule: 10, frigo: 150, chauffage: 1500 };
      $("#s7apps").addEventListener("click", function (ev) {
        var b = ev.target.closest("[data-app]"); if (!b || b.disabled) return;
        var app = b.getAttribute("data-app");
        b.disabled = true; b.classList.add("teal"); b.textContent = "Branchée : " + b.textContent.replace("Brancher : ", "");
        total += WATTS[app]; branches++;
        $("#s7total").textContent = total.toLocaleString("fr-CA") + " watts";
        tone(700 + branches * 120, 0.12, "sine", 0.1);
        if (app === "ampoule") { $("#s7bulb").setAttribute("fill", "#ffd94d"); $("#s7glow").setAttribute("opacity", "0.55"); }
        if (app === "frigo") { $("#s7frigo").setAttribute("fill", "#bfe3f2"); $("#s7frigolight").setAttribute("fill", "#ffd94d"); }
        if (app === "chauffage") { $("#s7heat").setAttribute("fill", "#e8a09a"); $("#s7waves").setAttribute("opacity", "1"); }
        if (branches === 3) {
          sndDing();
          finishStation(7,
            "près des maisons, un transformateur abaisse la tension à 120/240 volts ; ensuite, chaque appareil boit l'énergie dont il a besoin — le chauffage, beaucoup plus que l'ampoule !",
            "L'ampoule s'allume. De la pluie sur les montagnes jusqu'à la lumière de ta maison : le voyage de " + nom() + " est complet !",
            function () { showFact(7, "Voir la fin du voyage", showFinale); });
        }
      });
      window.scrollTo(0, 0);
    }
    /* ============ FINALE ============ */
    function fmtDuree(sec) {
      sec = Math.max(0, Math.round(sec));
      var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      if (h > 0) return h + " h " + (m < 10 ? "0" : "") + m + " min";
      return m > 0 ? (m + " min " + (s < 10 ? "0" : "") + s + " s") : (s + " s");
    }
    function confetti() {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var wrap = document.createElement("div");
      wrap.setAttribute("aria-hidden", "true");
      wrap.style.cssText = "position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50";
      var colors = ["#2e7fb8", "#f5a623", "#177e70", "#4aa3d8"];
      for (var i = 0; i < 22; i++) {
        var s = document.createElement("span");
        var sz = 6 + Math.random() * 7;
        s.style.cssText = "position:absolute;top:-22px;left:" + (Math.random() * 100) + "%;width:" + sz + "px;height:" + (sz * 1.5) + "px;border-radius:60% 60% 60% 60%/50% 50% 60% 60%;background:" + colors[i % 4] + ";opacity:.9;animation:cfall " + (2.2 + Math.random() * 1.6) + "s ease-in " + (Math.random() * 0.7) + "s forwards";
        wrap.appendChild(s);
      }
      document.body.appendChild(wrap);
      later(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 5200);
    }
    function showFinale() {
      stopLoops(); S.station = 0;
      var tempsHTML = "";
      if (S.t0 != null) {
        var sec = Math.max(0, Math.round((performance.now() - S.t0) / 1000));
        var record = false;
        if (!(save.best > 0)) save.best = null;
        if (sec > 0 && (!save.best || sec < save.best)) { save.best = sec; persist(); record = true; }
        tempsHTML = '<p style="font-size:1.05rem"><b>Durée de ta visite : ' + fmtDuree(sec) + "</b>"
          + (record ? " — c'est ton meilleur temps !" : (save.best ? " — ton record : " + fmtDuree(save.best) : "")) + "</p>";
        S.t0 = null;
      }
      var map = '<svg viewBox="0 0 360 150" role="img" aria-label="La carte du voyage : pluie, rivière, réservoir, turbine, fil, maison" style="width:100%;height:auto">'
        + '<path d="M28 84 C 90 50, 140 116, 196 82 C 240 56, 290 96, 334 78" stroke="#2e7fb8" stroke-width="4" fill="none" stroke-dasharray="8 6" stroke-linecap="round"/>'
        + '<g><ellipse cx="28" cy="52" rx="20" ry="12" fill="#fff" stroke="#20313b" stroke-width="2.5"/>'
        + '<path d="M18 68 l-3 8 M28 70 l-3 8 M38 68 l-3 8" stroke="#2e7fb8" stroke-width="2.5" stroke-linecap="round"/>'
        + '<text x="28" y="128" font-size="11.5" font-weight="700" fill="#20313b" text-anchor="middle">Pluie</text></g>'
        + '<g><path d="M78 92 q8 -10 16 0 t16 0" stroke="#2e7fb8" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        + '<path d="M78 106 q8 -10 16 0 t16 0" stroke="#2e7fb8" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        + '<text x="94" y="128" font-size="11.5" font-weight="700" fill="#20313b" text-anchor="middle">Rivière</text></g>'
        + '<g><path d="M140 66 L156 66 L160 108 L146 108 Z" fill="#c3ccd1" stroke="#20313b" stroke-width="2.5"/>'
        + '<path d="M118 76 q10 -5 22 0" stroke="#2e7fb8" stroke-width="3.5" fill="none"/>'
        + '<text x="146" y="128" font-size="11.5" font-weight="700" fill="#20313b" text-anchor="middle">Réservoir</text></g>'
        + '<g><circle cx="212" cy="84" r="17" fill="#dfe9ec" stroke="#20313b" stroke-width="2.5"/>'
        + '<path d="M212 70 v28 M198 84 h28 M202 74 l20 20 M222 74 l-20 20" stroke="#14506e" stroke-width="3"/>'
        + '<text x="212" y="128" font-size="11.5" font-weight="700" fill="#20313b" text-anchor="middle">Turbine</text></g>'
        + '<g><path d="M272 108 L280 62 L288 108 M262 72 h36 M266 88 h28" stroke="#20313b" stroke-width="2.5" fill="none"/>'
        + '<text x="280" y="128" font-size="11.5" font-weight="700" fill="#20313b" text-anchor="middle">Fil</text></g>'
        + '<g><rect x="312" y="76" width="34" height="28" fill="#f2d38a" stroke="#20313b" stroke-width="2.5"/>'
        + '<polygon points="306,76 329,58 352,76" fill="#b3543f" stroke="#20313b" stroke-width="2.5"/>'
        + '<rect x="324" y="88" width="10" height="16" fill="#ffd94d" stroke="#20313b" stroke-width="1.5"/>'
        + '<text x="329" y="128" font-size="11.5" font-weight="700" fill="#20313b" text-anchor="middle">Maison</text></g>'
        + "</svg>";
      var liste = STATION_TITLES.map(function (t, i) {
        return "<li><span>Station " + (i + 1) + " — " + t + '</span><span class="starsline">' + starStr(save.stars[i + 1] || 0) + "</span></li>";
      }).join("");
      $("#app").innerHTML = topbarHTML(0)
        + '<div class="card"><h2 class="bigtitle center">Le voyage complet de ' + nom() + "</h2>"
        + '<p class="center">De la pluie tombée sur les montagnes… jusqu\'à l\'ampoule de ta maison.</p>' + map + "</div>"
        + '<div class="factcard"><p class="kicker">Notre fierté</p><h2 class="facttitle">Fait ici, par du monde d\'ici</h2>'
        + "<p>Les lignes à <b>735 000 volts</b> ont été inventées au Québec — une première mondiale en 1965 — puis copiées ailleurs sur la planète.</p>"
        + "<p>La centrale <b>Robert-Bourassa</b>, la plus grande du Canada (environ 5 600 mégawatts), a été construite dans le Nord, en plein hiver, par des travailleuses et des travailleurs d'ici.</p>"
        + "<p>Et aujourd'hui, <b>plus de 9 kilowattheures sur 10</b> consommés au Québec viennent de nos rivières : une électricité presque entièrement renouvelable, produite chez nous.</p></div>"
        + '<div class="card"><h3>L\'essentiel à retenir</h3><ul class="stationlist">'
        + '<li><span><b>1.</b> L\'eau gardée en hauteur, c\'est de l\'énergie en réserve.</span></li>'
        + '<li><span><b>2.</b> En tombant, l\'eau gagne de la vitesse et de la pression.</span></li>'
        + '<li><span><b>3.</b> La turbine transforme la poussée de l\'eau en rotation.</span></li>'
        + '<li><span><b>4.</b> L\'alternateur — aimants et bobines de cuivre — transforme la rotation en courant alternatif : 60 allers-retours par seconde, le 60 hertz.</span></li>'
        + '<li><span><b>5.</b> Le transformateur monte la tension à 735 000 volts pour voyager loin en perdant presque rien.</span></li>'
        + '<li><span><b>6.</b> Les grandes lignes traversent le Québec presque à la vitesse de la lumière.</span></li>'
        + '<li><span><b>7.</b> Près des maisons, la tension redescend à 120/240 volts, et chaque appareil boit les watts dont il a besoin.</span></li>'
        + "</ul></div>"
        + '<div class="diploma"><p class="kicker">Centrale de la rivière aux Saumons</p>'
        + "<h2>Diplôme de visiteur de centrale</h2>"
        + '<p>Décerné à</p><p class="nom">' + nom() + ", la goutte d'eau</p>"
        + "<p>et à la personne curieuse qui l'a accompagnée, pour avoir suivi le voyage complet de l'électricité : du réservoir à la turbine, de l'alternateur aux grandes lignes, jusqu'à la maison.</p>"
        + '<ul class="stationlist">' + liste + "</ul>"
        + '<p style="font-size:1.1rem"><b>Total : ' + totalStars(save.stars) + " étoiles sur 14</b></p>"
        + tempsHTML
        + '<div class="btnrow"><button class="btn" id="btnReplay" type="button">Rejouer la visite</button>'
        + '<button class="btn second" id="btnHome" type="button">Retour à l\'accueil</button></div></div>'
        + '<p class="honnete">Schéma simplifié, mais fidèle : une vraie centrale a des centaines de systèmes de plus. La centrale de la rivière aux Saumons est inventée ; les principes, les chiffres et les faits québécois racontés dans la visite sont réels.</p>';
      wireTopbar(0);
      sndGood(); buzz([50, 80, 50]); confetti();
      later(function () { tone(1047, 0.3, "sine", 0.1); }, 250);
      $("#btnReplay").addEventListener("click", function () { S.runStars = {}; S.t0 = performance.now(); sndClick(); station1(); });
      $("#btnHome").addEventListener("click", function () { sndClick(); showHome(); });
      window.scrollTo(0, 0);
    }

    /* ============ DÉMARRAGE ============ */
    var STATION_FNS = [station1, station2, station3, station4, station5, station6, station7];
    showHome();
</script>
