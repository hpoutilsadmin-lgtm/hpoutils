<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sir H. Gepeto — le quiz — HP Outils</title>
<style>
  :root{--cream:#f7f3ea;--ink:#2a2620;--forest:#2f6b4f;--maple:#b5451b;--gold:#d9a441;--soft:#e8e0cf;--muted:#6b6459;--sky:#3f7fa3}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:16px 12px 24px;gap:12px;user-select:none}
  header{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  /* ——— Gepeto vrai (11 nov. 2026) : vraie pastille peinte (tete-pastille.png, SHA b26af210b2df25c53da60511c6fe414291ee16a39a7d696af27c70840c4ea4d4), en-tête ——— */
  header{align-items:center}
  .titre-groupe{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
  .gepeto-face{flex:none;width:48px;height:48px;border-radius:50%;background:#fffdf7;border:2px solid var(--soft);overflow:hidden}
  .gepeto-face img,.bulle-gepeto .gepeto-mini img{display:block;width:100%;height:100%;object-fit:cover}

  /* ——— Gepeto animateur (11 nov. 2026) : bulles de bande dessinée, textes du jeu seulement ——— */
  .bulle-gepeto{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--ink);border-radius:16px;border-bottom-left-radius:4px;padding:12px 14px;box-shadow:3px 3px 0 rgba(42,38,32,.15)}
  .bulle-gepeto .gepeto-mini{flex:none;width:48px;height:48px;border-radius:50%;background:#fffdf7;border:2px solid var(--soft);overflow:hidden}
  
  .bulle-gepeto p{margin:0;line-height:1.5;font-size:.95rem}

  h1{font-size:1.1rem;margin:0;color:var(--forest)}
  h1 small{font-weight:400;color:var(--muted);font-size:.8em}
  .hud{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:right}
  .hud b{display:block;font-size:1.15rem;color:var(--forest);font-variant-numeric:tabular-nums}
  .progress{width:100%;max-width:560px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--forest),var(--gold));width:0;transition:width .3s}
  #card{width:100%;max-width:560px;background:#fffdf7;border:2px solid var(--soft);border-radius:16px;
    padding:22px 20px;min-height:360px;display:flex;flex-direction:column;gap:14px;transition:opacity .2s}
  #card.fade{opacity:0}
  .jour{font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  h2{font-size:1.2rem;margin:0;color:var(--forest);line-height:1.3}
  .texte{margin:0;line-height:1.55;font-size:.95rem}
  .choix{display:flex;flex-direction:column;gap:10px}
  .choix button{background:#fff;border:2px solid var(--soft);border-radius:12px;padding:14px 16px;
    font-size:.95rem;text-align:left;cursor:pointer;color:var(--ink);font-weight:500;font-family:inherit;line-height:1.35}
  .choix button:hover{border-color:var(--forest);background:#f0f8f3}
  .choix button.bon{border-color:var(--forest);background:#e0f0e6}
  .choix button.mauvais{border-color:var(--maple);background:#fbe9e3}
  .choix button:disabled{cursor:default}
  .note{margin:0;color:var(--muted);font-size:.9rem;font-style:italic}
  .lien{display:inline-block;margin-top:6px;font-size:.88rem;color:var(--forest);font-weight:600;text-decoration:none;border-bottom:2px solid var(--gold)}
  footer{font-size:.8rem;color:#8a8277;max-width:560px;text-align:center;line-height:1.5}
  .restart{background:var(--forest);color:#fff;border:0;border-radius:10px;padding:12px 22px;
    font-size:1rem;font-weight:600;cursor:pointer;align-self:flex-start;box-shadow:0 3px 0 rgba(0,0,0,.15);font-family:inherit;min-height:48px}
  .badge{display:inline-block;background:var(--gold);color:var(--ink);padding:3px 10px;border-radius:999px;font-size:.85rem;font-weight:700}
  .resume{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  .resume div{background:var(--cream);padding:10px 12px;border-radius:10px;font-size:.9rem}
  .resume span{color:var(--muted);display:block;font-size:.8rem}

  /* ——— Mise en page standard HP (11 nov. 2026) : Retour, cibles 48 px, mouvement réduit ——— */
  .barre-hp{width:100%;max-width:560px;display:flex;justify-content:space-between}
  .btn-retour,.btn-son{background:#fffdf7;border:2px solid rgba(47,107,79,.3);border-radius:12px;min-height:48px;padding:12px 16px;font-family:inherit;font-size:.9rem;font-weight:600;color:#2f6b4f;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .btn-retour:active,.btn-son:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
  /* ——— Optimisation HP (12 nov. 2026) : lien « Aller voir » à 48 px, portrait Gepeto ——— */
  #card a.lien{min-height:48px;display:inline-flex;align-items:center}
  .gepeto{display:block;margin:2px auto 0;width:96px;height:96px;border-radius:50%;background:#fffdf7;border:2px solid var(--soft);overflow:hidden;object-fit:cover}
  /* ——— Arcade HP (12 nov. 2026) : série de bonnes réponses + fête de record, tons HP ——— */
  .popup-serie{display:inline-block;align-self:flex-start;background:var(--gold);color:var(--ink);border-radius:999px;padding:10px 16px;font-size:.95rem;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.15);animation:pop-serie .45s ease-out}
  @keyframes pop-serie{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
  /* ——— Panel quiz (nov. 2026) : focus clavier visible, ciel HP ——— */
  button:focus-visible,a.lien:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  .confettis{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .confetti{position:absolute;top:-12px;width:10px;height:14px;border-radius:2px;animation:tombe 2.6s ease-in forwards}
  @keyframes tombe{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
  @media (prefers-reduced-motion: reduce){.confettis{display:none}.popup-serie{animation:none}}
</style>
</head>

  const KEY = "hp:gepeto-quiz:best";
  const NB = 12;
  let sonActif = true;
  let ctxAudio = null;
  // Petit « ding » doux sur bonne réponse : sinus 523 → 784 Hz, volume 0,05.
  function ding() {
    if (!sonActif) return;
    try {
      ctxAudio = ctxAudio || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
      o.type = "sine"; o.frequency.value = 523; g.gain.value = 0.05;
      o.connect(g); g.connect(ctxAudio.destination);
      o.start();
      o.frequency.exponentialRampToValueAtTime(784, ctxAudio.currentTime + 0.12);
      g.gain.exponentialRampToValueAtTime(0.0001, ctxAudio.currentTime + 0.25);
      o.stop(ctxAudio.currentTime + 0.3);
    } catch (e) { /* audio indisponible : le jeu reste silencieux */ }
  }
  // Fanfare douce de record : trois notes sinus 523 → 659 → 784 Hz, volume 0,06.
  function fanfare() {
    if (!sonActif) return;
    try {
      ctxAudio = ctxAudio || new (window.AudioContext || window.webkitAudioContext)();
      [523, 659, 784].forEach((freq, k) => {
        const o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
        const t = ctxAudio.currentTime + k * 0.14;
        o.type = "sine"; o.frequency.value = freq; g.gain.value = 0.06;
        o.connect(g); g.connect(ctxAudio.destination);
        o.start(t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.stop(t + 0.25);
      });
    } catch (e) { /* audio indisponible : le jeu reste silencieux */ }
  }
  // Confettis doux aux couleurs HP pour fêter un nouveau record (cachés en mouvement réduit).
  const COULEURS_CONFETTIS = ["#2f6b4f", "#d9a441", "#b5451b", "#3f7fa3", "#e8e0cf"];
  function confettis() {
    const boite = document.createElement("div");
    boite.className = "confettis";
    boite.setAttribute("aria-hidden", "true");
    for (let k = 0; k < 24; k++) {
      const c = document.createElement("i");
      c.className = "confetti";
      c.style.left = `${(k * 41) % 100}%`;
      c.style.background = COULEURS_CONFETTIS[k % COULEURS_CONFETTIS.length];
      c.style.animationDelay = `${(k % 8) * 0.15}s`;
      boite.appendChild(c);
    }
    document.body.appendChild(boite);
    setTimeout(() => boite.remove(), 4500);
  }
  let state = null;
  const card = document.getElementById("card");
  const prog = document.getElementById("prog");
  const qnum = document.getElementById("qnum");
  const best = () => { try { return Number(localStorage.getItem(KEY) || 0); } catch (e) { return 0; } };

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function start() {
    state = { questions: shuffle(BANQUE).slice(0, NB), i: 0, bonnes: 0, serie: 0, meilleureSerie: 0, bonus: 0 };
    prog.style.width = "0%";
    renderQuestion();
  }

  function renderQuestion() {
    if (state.i >= state.questions.length) return finish();
    const q = state.questions[state.i];
    const choix = shuffle(q.a.map((texte, idx) => ({ texte, correct: idx === q.c })));
    state.courant = { q, choix };
    qnum.textContent = `${state.i + 1} / ${state.questions.length}`;
    prog.style.width = `${(state.i / state.questions.length) * 100}%`;

    card.classList.add("fade");
    setTimeout(() => {
      card.innerHTML = `
        <div class="jour">Question ${state.i + 1} sur ${state.questions.length}${state.serie >= 2 ? ` · 🔥 Série de ${state.serie}` : ""}</div>
        <h2>${q.q}</h2>
        <div class="choix" id="choix">
          ${choix.map((c, i) => `<button data-i="${i}">${c.texte}</button>`).join("")}
        </div>`;
      card.classList.remove("fade");
      card.querySelectorAll("button[data-i]").forEach(b =>
        b.addEventListener("click", () => repondre(+b.dataset.i)));
    }, 120);
  }

  function repondre(i) {
    const { q, choix } = state.courant;
    const bon = choix[i].correct;
    // Arcade : série de bonnes réponses d'affilée. Le score de base reste 1 point
    // par bonne réponse ; le bonus (série − 1 dès la 2e bonne d'affilée) est une
    // couche séparée, affichée comme telle, jamais ajoutée au score de base.
    let gainBonus = 0;
    if (bon) {
      state.bonnes++; ding();
      state.serie++;
      if (state.serie > state.meilleureSerie) state.meilleureSerie = state.serie;

    { min: 3, titre: "Visiteur en Herbe", texte: "Bon début ! Le site est plein de belles découvertes : prends ton temps pour l'explorer." },
    { min: 0, titre: "Nouveau Compagnon", texte: "Bienvenue ! Chaque question t'a montré un coin du site : la visite ne fait que commencer." }
  ];
  function rang(n) { return RANGS.find(r => n >= r.min) || RANGS[RANGS.length - 1]; }

  function feedback(n) {
    const p = n / NB;
    if (p === 1) return "Parfait. Tu connais le site comme Sir H. Gepeto.";
    if (p >= 0.75) return "Très bon. Tu en sais plus que la plupart des visiteurs.";
    if (p >= 0.5) return "Pas mal. Quelques sections à explorer encore.";
    return "Bonne découverte. Les pages du site t'attendent.";
  }
