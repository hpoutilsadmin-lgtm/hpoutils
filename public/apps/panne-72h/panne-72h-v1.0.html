<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panne de courant — 72 h — HP Outils</title>
<style>
  :root{--cream:#f7f3ea;--ink:#2a2620;--forest:#2f6b4f;--maple:#b5451b;--gold:#d9a441;--soft:#e8e0cf;--muted:#6b6459;--sky:#3f7fa3}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:16px 12px 24px;gap:14px;user-select:none}
  header{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  /* ——— Gepeto vrai (11 nov. 2026) : face du maître (tete-pastille.png, SHA b26af210), en-tête ——— */
  header{align-items:center}
  .titre-groupe{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
  .gepeto-face{flex:none;width:48px;height:48px;border-radius:50%;background:#fffdf7;border:2px solid var(--soft);overflow:hidden}
  .gepeto-face svg{display:block;width:100%;height:100%}
  .gepeto-face img{display:block;width:100%;height:100%;object-fit:cover}

  h1{font-size:1.1rem;margin:0;color:var(--forest)}
  h1 small{font-weight:400;color:var(--muted);font-size:.8em}
  .heure{font-size:.79rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:right}
  .heure b{font-size:1.2rem;color:var(--forest);display:block;font-variant-numeric:tabular-nums}
  .stats{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .stat{background:#fffdf7;border:1px solid var(--soft);border-radius:10px;padding:8px 4px;font-size:.79rem;text-align:center}
  .stat span{display:block;color:var(--muted);margin-bottom:2px;font-weight:600}
  .bar{height:5px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--forest);border-radius:3px;transition:width .3s}
  .bar i.low{background:var(--maple)}
  #card{width:100%;max-width:560px;background:#fffdf7;border:2px solid var(--soft);border-radius:16px;
    padding:22px 20px;min-height:320px;display:flex;flex-direction:column;gap:14px;transition:opacity .2s;
    box-shadow:0 4px 14px rgba(42,38,32,.08)}
  #card.fade{opacity:0}
  .jour{font-size:.79rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  h2{font-size:1.25rem;margin:0;color:var(--forest);line-height:1.2}
  .texte{margin:0;line-height:1.55;font-size:.98rem}
  .choix{display:flex;flex-direction:column;gap:10px;margin-top:auto}
  .choix button{background:#fff;border:2px solid var(--soft);border-radius:12px;padding:12px 14px;
    font-size:.95rem;text-align:left;cursor:pointer;color:var(--ink);font-weight:500;font-family:inherit;min-height:48px}
  .choix button:hover{border-color:var(--forest);background:#f0f8f3}
  .choix button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  .restart:focus-visible,.btn-retour:focus-visible,.btn-son:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  .note{margin:0;color:var(--muted);font-size:.9rem;font-style:italic;min-height:1.2em}
  .effets{margin:0;font-size:.9rem;font-weight:600;color:var(--forest)}
  footer{font-size:.79rem;color:#8a8277;max-width:560px;text-align:center;line-height:1.5}
  .restart{background:var(--forest);color:#fff;border:0;border-radius:10px;padding:12px 22px;
    font-size:1rem;font-weight:600;cursor:pointer;align-self:flex-start;box-shadow:0 3px 0 rgba(0,0,0,.15);font-family:inherit;min-height:48px}
  .badge{display:inline-block;background:var(--gold);color:var(--ink);padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700}
  .resume{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  .resume div{background:var(--cream);padding:8px 10px;border-radius:8px;font-size:.85rem}
  .resume span{color:var(--muted);display:block;font-size:.79rem}

  /* ——— Mise en page standard HP (11 nov. 2026) : Retour, cibles 48 px, mouvement réduit ——— */
  .barre-hp{width:100%;max-width:560px;display:flex;justify-content:space-between}
  .btn-retour{background:#fffdf7;border:2px solid rgba(47,107,79,.3);border-radius:12px;min-height:48px;padding:12px 16px;font-family:inherit;font-size:.9rem;font-weight:600;color:#2f6b4f;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .btn-retour:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
  .btn-son{background:#fffdf7;border:2px solid rgba(47,107,79,.3);border-radius:12px;min-height:48px;padding:12px 16px;font-family:inherit;font-size:.9rem;font-weight:600;color:#2f6b4f;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .btn-son:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
  .progression{width:100%;max-width:560px;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
  .progression i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--forest),var(--gold) 60%,var(--sky));border-radius:4px;transition:width .3s}
  /* ——— Paliers de progression : doux et encourageants, dans le ton HP ——— */
  .niveau-ligne{width:100%;max-width:560px;display:flex;justify-content:center}
  .niveau{background:#fffdf7;border:2px solid var(--sky);border-radius:999px;padding:6px 14px;font-size:.79rem;font-weight:700;color:var(--forest)}
  .niveau b{color:var(--sky)}
  .niveau.nouveau{animation:palier-doux .6s ease-in-out 2}
  @keyframes palier-doux{50%{transform:scale(1.07)}}
  .palier{margin:0;color:var(--sky);font-size:.9rem;font-weight:600}
  /* ——— Arcade doux : série de bons choix + célébration de record ——— */
  .serie-ligne{width:100%;max-width:560px;display:flex;justify-content:space-between;gap:8px}
  .serie,.bonus-arcade{background:#fffdf7;border:1px solid var(--soft);border-radius:999px;padding:6px 12px;font-size:.79rem;font-weight:600;color:var(--forest)}
  .bonus-arcade{color:var(--maple)}
  .confettis{position:relative;height:26px;overflow:hidden}
  .confettis i{position:absolute;top:0;width:10px;height:10px;border-radius:50%;animation:tombe 1.2s ease-in forwards}
  @keyframes tombe{to{transform:translateY(22px) rotate(180deg);opacity:.25}}
  .record-badge{display:inline-block;background:var(--gold);color:var(--ink);padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;animation:record-pulse 1s ease-in-out 2}
  @keyframes record-pulse{50%{transform:scale(1.12)}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

    { h: 54, titre: "Le moral", texte: "Ça fait deux jours. Le silence pèse.",
      choix: [

    { h: 66, titre: "La dernière ligne droite", texte: "Plus que quelques heures. La maison est fatiguée, toi aussi.",
      choix: [

        { t: "Se reposer, on a tout fait", e: { moral: +5, chaleur: +3 }, note: "Tu as tenu 66 heures. Bravo." }
      ]}
  ];

  // Paliers de progression : par moments traversés, doux et encourageants.
  // Le score ne change pas : le palier est affiché à part, hors score.
  const NIVEAUX = [
    { seuil: 1,  nom: "Première lueur",   desc: "Tu as allumé la première lampe." },
    { seuil: 5,  nom: "Main tendue",      desc: "Tu prends soin des autres autant que de toi." },
    { seuil: 9,  nom: "Feu de camp",      desc: "La chaleur et les bons gestes tiennent la maison." },
    { seuil: 13, nom: "Cœur tranquille",  desc: "Tu as traversé la moitié des moments, sans te presser." },
    { seuil: 18, nom: "Troisième aube",   desc: "Trois matins sans courant, et tu tiens toujours." },
    { seuil: 22, nom: "Lumière retrouvée", desc: "Les 22 moments traversés, du début à la fin." }
  ];
  function niveauPour(n) {
    let idx = 0;
    for (let k = 0; k < NIVEAUX.length; k++) if (n >= NIVEAUX[k].seuil) idx = k;
    return { idx, nom: NIVEAUX[idx].nom, desc: NIVEAUX[idx].desc };
  }

  let state = null;
  const card = document.getElementById("card");
  const statsEl = document.getElementById("stats");
  const heureEl = document.getElementById("heure");
  const best = () => { try { return Number(localStorage.getItem(KEY) || 0); } catch (e) { return 0; } };
  const progEl = document.getElementById("prog");
  const niveauEl = document.getElementById("niveau");
  let niveauIdx = -1;
  function majNiveau(moment) {
    const niv = niveauPour(moment);
    const monte = niv.idx > niveauIdx;
    niveauIdx = niv.idx;
    niveauEl.innerHTML = "✦ Palier " + (niv.idx + 1) + "/" + NIVEAUX.length + " : <b>" + niv.nom + "</b>";
    if (monte) {
      niveauEl.classList.remove("nouveau");
      void niveauEl.offsetWidth; // relance l'animation douce du palier
      niveauEl.classList.add("nouveau");
      bip(523, 0.12); bip(659, 0.12, 0.1); bip(784, 0.18, 0.2);
    }
    return { monte, niv };
  }
  function razNiveau() {
    niveauIdx = -1;
    niveauEl.classList.remove("nouveau");
    niveauEl.textContent = "✦ Paliers : 6 à découvrir";
  }

  // Arcade doux : série de bons choix (aucune ressource ne baisse) + bonus séparé.
  // Le score de base ne change pas : le bonus est affiché à part, hors score.
  let serie = 0, serieMax = 0, bonusArcade = 0;
  const serieEl = document.getElementById("serie");
  const bonusEl = document.getElementById("bonus");
  function majSerie() {
    // Sans série en cours, pas de multiplicateur affiché (×1,0 prêtait à confusion).
    serieEl.textContent = serie === 0
      ? "Série de bons choix : 0"
      : "Série de bons choix : " + serie + " (×" + (1 + 0.1 * serie).toFixed(1).replace(".", ",") + ")";
    bonusEl.textContent = "Bonus arcade : +" + bonusArcade;
  }
  function razSerie() { serie = 0; serieMax = 0; bonusArcade = 0; majSerie(); }

  // Son doux (WebAudio, sinus, volume 0,05) — coupé par le bouton Son.
  let audioCtx = null, sonActif = true;
  function bip(freq, duree, delai) {
    if (!sonActif) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const t = audioCtx.currentTime + (delai || 0);
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (duree || 0.12));
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + (duree || 0.12) + 0.05);
    } catch (e) { /* son indisponible : le jeu reste silencieux */ }
  }
  const btnSon = document.getElementById("son");
  btnSon.addEventListener("click", () => {
    sonActif = !sonActif;
    btnSon.textContent = sonActif ? "🔊 Son" : "🔇 Son";
    btnSon.setAttribute("aria-pressed", String(sonActif));
    if (sonActif) bip(520);
  });

  function renderStats() {
    statsEl.innerHTML = RESSOURCES.map(r => {
      const v = state.res[r];
      return `<div class="stat"><span>${LABELS[r]}</span>${v}<div class="bar"><i class="${v < 25 ? 'low' : ''}" style="width:${v}%"></i></div></div>`;
    }).join("");
  }

  function start() {
    state = { res: { eau: 70, nourriture: 70, chaleur: 70, batterie: 70, moral: 70 }, i: 0 };
    razSerie();
    razNiveau();
    heureEl.textContent = 0;
    progEl.style.width = "0%";
    renderStats();
    renderEvent();
    bip(392);
  }

  function applyDeltas(d) {
    for (const [k, v] of Object.entries(d))
      state.res[k] = Math.max(0, Math.min(100, state.res[k] + v));
  }

  function renderEvent() {
    const ev = EVENTS[state.i];
    if (!ev) return finish();
    heureEl.textContent = ev.h;
    progEl.style.width = ((state.i + 1) / EVENTS.length * 100) + "%";
    const palier = majNiveau(state.i + 1);
    card.classList.add("fade");
    setTimeout(() => {
      card.innerHTML = `
        <div class="jour">Heure ${ev.h} / 72 · Moment ${state.i + 1} sur ${EVENTS.length}</div>
        <h2>${ev.titre}</h2>
        ${palier.monte ? `<p class="palier">✦ Nouveau palier : ${palier.niv.nom} — ${palier.niv.desc}</p>` : ""}
        <p class="texte">${ev.texte}</p>
        <div class="choix">${ev.choix.map((c, i) => `<button data-i="${i}">${c.t}</button>`).join("")}</div>`;
      card.classList.remove("fade");
      card.querySelectorAll("button[data-i]").forEach(b =>
        b.addEventListener("click", () => choose(+b.dataset.i)));
    }, 120);
  }

  function choose(i) {
    const ev = EVENTS[state.i], c = ev.choix[i];
    // Série arcade : le choix est « bon » si aucune ressource ne baisse.
    const bonChoix = Object.values(c.e).every(v => v >= 0);
    if (bonChoix) { serie++; bonusArcade += serie; if (serie > serieMax) serieMax = serie; }
    else serie = 0;
    majSerie();
    applyDeltas(c.e);
    renderStats();
    bip(520);
    if (bonChoix) bip(Math.min(800, 600 + serie * 20), 0.12, 0.05);
    // Effet visible du choix (données du choix, rien d'inventé) : avant, il fallait
    // comparer les chiffres des ressources pour deviner ce qui avait changé.
    const effets = Object.entries(c.e).map(([k, v]) => LABELS[k] + " " + (v > 0 ? "+" : "") + v).join(" · ");
    card.innerHTML = `
      <div class="jour">Heure ${ev.h} / 72 · Moment ${state.i + 1} sur ${EVENTS.length}</div>
      <h2>${ev.titre}</h2>
      <p class="texte">${c.t}.</p>
      <p class="effets">Effet : ${effets || "aucun changement aux ressources"}</p>
      <p class="note">${c.note}</p>
      <div class="choix"><button id="next">Continuer →</button></div>`;
    document.getElementById("next").addEventListener("click", () => {
      state.i++;
      if (state.i >= EVENTS.length) finish();
      else renderEvent();
    });
  }

  function feedback() {
    const vals = Object.values(state.res);
    const moy = vals.reduce((a, b) => a + b, 0) / vals.length;
    if (Math.min(...vals) === 0) return "Ça a été tough. Un kit 72 h préparé d'avance change tout.";
    if (moy > 65) return "Solide. Tu es prêt·e pour la prochaine.";
    if (moy > 45) return "Tu as tenu. C'est ça qui compte.";
    return "Ça s'est joué de justesse. Un peu de préparation ferait une grosse différence.";
  }

  function finish() {
    const score = Math.round(Object.values(state.res).reduce((a, b) => a + b, 0) / 5);
    const isBest = score > best();
    if (isBest) { try { localStorage.setItem(KEY, String(score)); } catch (e) {} }
    const nivFinal = niveauPour(EVENTS.length);
    progEl.style.width = "100%";
    bip(523, 0.18); bip(659, 0.22, 0.18);
    // Célébration de record : fanfare douce + pastilles colorées, jamais punitive.
    // Les couleurs viennent des tokens HP définis en :root (crème, encre, forêt, érable, or, ciel).
    const cs = getComputedStyle(document.documentElement);
    const token = n => (cs.getPropertyValue(n) || "").trim();
    const couleurs = [token("--forest") || "#2f6b4f", token("--maple") || "#b5451b", token("--gold") || "#d9a441", token("--sky") || "#3f7fa3", token("--cream") || "#f7f3ea"];
    let confettis = "";
    if (isBest) {
      bip(784, 0.25, 0.36);
      let pastilles = "";
      for (let p = 0; p < 24; p++) {
        pastilles += `<i style="left:${(p * 41) % 96}%;background:${couleurs[p % couleurs.length]};animation-delay:${(p % 8) * 0.08}s"></i>`;
      }
      confettis = `<div class="confettis" aria-hidden="true">${pastilles}</div>
      <p style="margin:0"><span class="record-badge">🎉 Nouveau record !</span></p>`;
    }
    card.innerHTML = `
      <div class="jour">Heure 72 / 72</div>
      <h2>Le courant est revenu</h2>
      ${confettis}
      <p class="texte">${feedback()}</p>
      <p class="note">Palier atteint : <b>${nivFinal.nom}</b> — ${nivFinal.desc}</p>
      <div class="resume">${RESSOURCES.map(r => `<div><span>${LABELS[r]}</span>${state.res[r]}</div>`).join("")}</div>
      <p class="note">Score : <span class="badge">${score}</span> · Record : <span class="badge">${best()}</span></p>
      <p class="note">Bonus arcade : +${bonusArcade} (série max ${serieMax}) — affiché à part, le score ne change pas.</p>
      <button class="restart" id="again">Rejouer</button>
      <p class="note" style="margin-top:8px">Le kit Urgence 72 heures de HP Outils aide à préparer une vraie panne.</p>`;
    document.getElementById("again").addEventListener("click", renderStart);
  }

  function renderStart() {
    razSerie();
    razNiveau();
    // Écran de démarrage propre : ressources de départ (70) visibles tout de suite,
    // heure et progression remises à zéro (elles restaient à 66 / 100 % après Rejouer).
    state = { res: { eau: 70, nourriture: 70, chaleur: 70, batterie: 70, moral: 70 }, i: 0 };
    heureEl.textContent = 0;
    progEl.style.width = "0%";
    renderStats();
    card.innerHTML = `
      <div class="jour">72 heures · 22 moments · 6 paliers</div>
      <h2>Panne de courant — 72 h</h2>
      <p class="texte">Une panne prolongée. Cinq ressources à garder au-dessus du rouge : eau, nourriture, chaleur, batterie, moral. Aucune bonne réponse — juste des décisions. Un choix qui ne fait baisser aucune ressource prolonge ta série de bons choix.</p>
      <div class="choix"><button id="go">Commencer</button></div>`;
    document.getElementById("go").addEventListener("click", start);
  }

  renderStart();
})();
