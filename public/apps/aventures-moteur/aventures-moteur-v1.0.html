<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les aventures du moteur — HP Outils</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#1a2634}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid;place-items:center;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{position:relative;width:100%;max-width:720px;aspect-ratio:4/3;max-height:100vh;max-height:100dvh}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  @media(min-width:720px){canvas{border-radius:16px}}
  #ui{position:absolute;inset:0;pointer-events:none}
  #ui > *{pointer-events:auto}
  .btn{position:absolute;background:rgba(255,253,247,.95);border:2px solid rgba(47,107,79,.3);
    border-radius:12px;padding:8px 14px;font-family:inherit;font-size:.9rem;font-weight:600;
    color:#2f6b4f;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .1s;min-height:48px}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
  .btn-back{top:10px;left:10px;padding:8px 12px;font-size:.85rem}
  .btn-back::before{content:"← ";font-weight:700}
  .btn-sound{top:10px;right:10px;padding:8px 11px;font-size:1rem;min-width:48px}
  .choice-panel{position:absolute;bottom:12px;left:12px;right:12px;
    display:flex;flex-direction:column;gap:8px}
  .choice-panel button{background:rgba(255,253,247,.97);border:2px solid rgba(47,107,79,.25);
    border-radius:14px;padding:13px 16px;font-family:inherit;font-size:.93rem;font-weight:600;
    color:#2a2620;cursor:pointer;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.12);
    display:flex;justify-content:space-between;align-items:center;transition:transform .1s;min-height:48px}
  .choice-panel button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
  .choice-panel button::after{content:"→";opacity:.4;font-weight:700}
  .story-text{position:absolute;top:56px;left:12px;right:12px;
    background:rgba(255,253,247,.95);border-radius:14px;padding:12px 16px;
    font-size:.93rem;line-height:1.45;color:#2a2620;box-shadow:0 3px 0 rgba(0,0,0,.08);
    max-height:140px;overflow-y:auto}
  .story-text h2{margin:0 0 4px;font-size:1rem;color:#2f6b4f}
  .story-text p{margin:0}
  .color-picker{position:absolute;bottom:10px;left:10px;right:10px;
    display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
    background:rgba(255,253,247,.95);border-radius:12px;padding:8px;align-items:center}
  .color-picker button{width:48px;height:48px;border-radius:50%;border:2px solid rgba(0,0,0,.1);
    cursor:pointer;padding:0;transition:transform .1s}
  .color-picker button:active{transform:scale(.9)}
  .color-picker button.sel{box-shadow:0 0 0 3px #2f6b4f}
  .size-picker{display:flex;gap:6px;align-items:center;margin-left:6px;padding-left:8px;
    border-left:1px solid rgba(0,0,0,.1)}
  .size-picker button{border-radius:50%;background:#2a2620;padding:0;border:0}
  .size-picker button.sel{box-shadow:0 0 0 2px #2f6b4f}
  .atelier-panel{position:absolute;bottom:0;left:0;right:0;
    background:rgba(255,253,247,.97);padding:8px 10px 10px;
    border-top-left-radius:14px;border-top-right-radius:14px;
    display:flex;flex-direction:column;gap:5px;max-height:48%;overflow-y:auto}
  .atelier-row{display:flex;align-items:center;gap:6px}
  .atelier-label{font-size:.8rem;font-weight:700;color:#6b6459;text-transform:uppercase;
    letter-spacing:.05em;min-width:66px}
  .atelier-options{display:flex;gap:5px;overflow-x:auto;flex:1;padding-bottom:2px;
    scrollbar-width:thin}
  .atelier-options button{flex-shrink:0;min-width:48px;height:48px;border:2px solid #e8e0cf;
    border-radius:8px;background:#fff;cursor:pointer;font-size:1rem;
    display:grid;place-items:center;padding:0 5px;font-family:inherit}
  .atelier-options button.sel{border-color:#2f6b4f;background:#eaf3ec}
  .atelier-options button.color{width:48px;height:48px;border-radius:50%;padding:0}
  footer{position:fixed;bottom:4px;left:0;right:0;text-align:center;font-size:.8rem;
    color:rgba(255,255,255,.4);pointer-events:none}


  /* ——— Gepeto vrai (11 nov. 2026) : face du maître (tete-pastille.png, SHA b26af210b2df25c53da60511c6fe414291ee16a39a7d696af27c70840c4ea4d4), en-tête ——— */
  .gepeto-face{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,253,247,.95);border:2px solid rgba(47,107,79,.3);overflow:hidden;pointer-events:none;z-index:2}
  .gepeto-face.cache{display:none}
  .gepeto-face img{display:block;width:100%;height:100%;object-fit:cover}
  /* ——— Mise en page standard HP (11 nov. 2026) : cibles 48 px, textes ≥ 12,5 px, mouvement réduit ——— */
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>

<script>
(() => {
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
      if(r>w/2)r=w/2;if(r>h/2)r=h/2;
      this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);
      this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);
      this.arcTo(x,y,x+w,y,r);this.closePath();
    };
  }
  
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const ui = document.getElementById('ui');
  const W = 640, H = 480;
  canvas.width = W; canvas.height = H;
  
  const C = { cream:'#f7f3ea', ink:'#2a2620', forest:'#2f6b4f', maple:'#b5451b', gold:'#d9a441', soft:'#e8e0cf', sky:'#3f7fa3', muted:'#6b6459' };
  
  const KEYS = {
    visits: 'hp:aventures:visites',
    hugs: 'hp:aventures:calins',
    jardin: 'hp:aventures:jardin',
    dessin: 'hp:aventures:dessin',
    settings: 'hp:aventures:settings',
    custom: 'hp:aventures:custom',
    finished: 'hp:aventures:terminees'
  };
  
  let settings = (() => {
    try { return JSON.parse(localStorage.getItem(KEYS.settings)) || {}; }
    catch { return {}; }
  })();
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches && settings.reduceMotion === undefined) {
    settings.reduceMotion = true;
  }
  if (settings.sound === undefined) settings.sound = true;
  const saveSettings = () => { try { localStorage.setItem(KEYS.settings, JSON.stringify(settings)); } catch { } };
  
  // ─── CUSTOMISATION ───
  const BODY_COLORS = [
    { name:'Forêt',  main:'#b8d8c8', dark:'#7ab8a0', glow:'rgba(168,207,186,0.5)' },
    { name:'Ciel',   main:'#b8d8f0', dark:'#7aa0d0', glow:'rgba(168,200,240,0.5)' },
    { name:'Soleil', main:'#f0e0a8', dark:'#d0b860', glow:'rgba(240,220,160,0.5)' },
    { name:'Rose',   main:'#f0c8d8', dark:'#d090b0', glow:'rgba(240,200,216,0.5)' },
    { name:'Lavande',main:'#d8c8f0', dark:'#a090d0', glow:'rgba(216,200,240,0.5)' },
    { name:'Menthe', main:'#c8f0d8', dark:'#80d0a0', glow:'rgba(200,240,216,0.5)' }
  ];
  const HATS = ['none','tuque','cap','crown','bow','flower'];
  const HAT_ICONS = ['—','🎩','🧢','👑','🎀','🌸'];
  const HAT_LABELS = ['Aucun','Tuque','Casquette','Couronne','Nœud','Fleur'];
  const ACCESS_LABELS = ['Aucun','Lunettes','Écharpe','Nœud papillon','Casque audio','Sac à dos'];
  const CLOTHING_LABELS = ['Aucun','T-shirt','Chandail à capuchon','Salopette'];
  const ACCESS = ['none','glasses','scarf','bowtie','headphones','backpack'];
  const ACCESS_ICONS = ['—','👓','🧣','🎀','🎧','🎒'];
  const CLOTHING = ['none','tshirt','hoodie','overall'];
  const CLOTHING_ICONS = ['—','👕','🧥','👖'];
  const EXPRESSIONS = ['smile','happy','wink','surprised','sleepy'];
  const EXPR_ICONS = ['😊','😄','😉','😮','😴'];
  const EXPR_LABELS = ['Sourire','Content','Clin d\'œil','Surprise','Endormi'];
  
  let custom = (() => {
    try {
      const saved = JSON.parse(localStorage.getItem(KEYS.custom)) || {};
      return {
        bodyColor: saved.bodyColor ?? 0,
        hat: saved.hat ?? 0,
        accessory: saved.accessory ?? 0,
        clothing: saved.clothing ?? 0,
        expression: saved.expression ?? 0
      };
    } catch { return { bodyColor:0, hat:0, accessory:0, clothing:0, expression:0 }; }
  })();
  const saveCustom = () => { try { localStorage.setItem(KEYS.custom, JSON.stringify(custom)); } catch { } };
  
  let visits = 1;
  try { const v = parseInt(localStorage.getItem(KEYS.visits) || '0', 10); visits = (isNaN(v) ? 0 : v) + 1; localStorage.setItem(KEYS.visits, String(visits)); } catch { }
  let hugs = 0;
  try { const h = parseInt(localStorage.getItem(KEYS.hugs) || '0', 10); hugs = isNaN(h) ? 0 : h; } catch { }
  const addHug = () => { hugs++; try { localStorage.setItem(KEYS.hugs, String(hugs)); } catch { } };
  
  // ─── HISTOIRES TERMINÉES (carte de voyage) ───
  let finished = new Set();
  try {
    const raw = JSON.parse(localStorage.getItem(KEYS.finished));
    if (Array.isArray(raw)) finished = new Set(raw.filter(id => typeof id === 'string'));
  } catch { }
  const saveFinished = () => { try { localStorage.setItem(KEYS.finished, JSON.stringify([...finished])); } catch { } };
  const markFinished = id => { if (!finished.has(id)) { finished.add(id); saveFinished(); } };
  
  // ─── AUDIO ───
  let audioCtx = null;
  const getAudio = () => {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch { } }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  };
  function playNote(freq, dur = 0.3, vol = 0.06) {
    if (!settings.sound) return;
    const a = getAudio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, a.currentTime);
    g.gain.linearRampToValueAtTime(vol, a.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g).connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  }
  
  // ─── BLOB ───
  const blob = {
    x: W/2, y: H*0.65, targetX: W/2, targetY: H*0.65, r: 52,
    purr: 0, happy: 0, breathing: false, breathTime: 0,
    eyeX: 0, eyeY: 0, eyeTargetX: 0, eyeTargetY: 0,
    bounce: 0
  };
  const particles = [];
  let screen = 'hub';
  
  function drawBlob(x, y, r, opts = {}) {
    const cm = opts.custom || custom;
    const bodyC = BODY_COLORS[cm.bodyColor] || BODY_COLORS[0];
    const expr = EXPRESSIONS[cm.expression] || 'smile';
    const purr = opts.purr || 0;
    const happy = opts.happy || 0;
    const eyeX = opts.eyeX || 0;
    const eyeY = opts.eyeY || 0;
    const breathScale = opts.breathScale || 1;
    const exprOverride = opts.exprOverride || expr;
    const rs = r * breathScale;
    const t = performance.now() / 1000;
    
    const glow = ctx.createRadialGradient(x, y, rs*0.5, x, y, rs*1.8);
    glow.addColorStop(0, bodyC.glow);
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y, rs*1.8, 0, Math.PI*2); ctx.fill();
    
    const segments = 20;
    const amp = settings.reduceMotion ? 0.008 : 0.03;
    const pts = [];
    for (let i = 0; i < segments; i++) {
      const a = (i/segments)*Math.PI*2;
      const wob = 1 + Math.sin(a*3 + t*2)*amp + Math.cos(a*5 + t*3)*amp*0.5;
      pts.push({ x: x + Math.cos(a)*rs*wob, y: y + Math.sin(a)*rs*wob });
    }
    ctx.beginPath();
    ctx.moveTo((pts[0].x + pts[segments-1].x)/2, (pts[0].y + pts[segments-1].y)/2);
    for (let i = 0; i < segments; i++) {
      const p = pts[i], n = pts[(i+1)%segments];
      ctx.quadraticCurveTo(p.x, p.y, (p.x + n.x)/2, (p.y + n.y)/2);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(x - rs*0.3, y - rs*0.3, rs*0.1, x, y, rs);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.5, bodyC.main);
    g.addColorStop(1, bodyC.dark);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(47,107,79,0.2)'; ctx.lineWidth = 2; ctx.stroke();
    
    if (cm.clothing > 0) drawClothing(x, y, rs, CLOTHING[cm.clothing]);
    
    drawEyes(x, y, rs, exprOverride, eyeX, eyeY);
    drawMouth(x, y, rs, exprOverride, happy);
    
    if (cm.accessory === 1) drawGlasses(x, y, rs, eyeX, eyeY);
    if (cm.accessory === 2) drawScarf(x, y, rs);
    if (cm.accessory === 3) drawBowtie(x, y, rs);
    if (cm.accessory === 4) drawHeadphones(x, y, rs);
    if (cm.accessory === 5) drawBackpack(x, y, rs);
    
    if (cm.hat > 0) drawHat(x, y, rs, HATS[cm.hat]);
    
    if (purr > 0.3) {
      ctx.fillStyle = `rgba(240,160,176,${purr*0.6})`;
      const eo = rs*0.28;
      ctx.beginPath(); ctx.arc(x-eo-rs*0.15, y+rs*0.15, rs*0.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+eo+rs*0.15, y+rs*0.15, rs*0.1, 0, Math.PI*2); ctx.fill();
    }
  }
  
  function drawEyes(x, y, rs, expr, ex, ey) {
    const eo = rs*0.28, es = rs*0.13;
    const e1x = x-eo+ex, e2x = x+eo+ex, eyy = y-rs*0.1+ey;
    if (expr === 'sleepy') {
      ctx.strokeStyle = C.ink; ctx.lineWidth = rs*0.05; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(e1x, eyy, es, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(e2x, eyy, es, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
    } else if (expr === 'wink') {
      ctx.fillStyle = C.ink;
      ctx.beginPath(); ctx.arc(e1x, eyy, es, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(e1x+es*0.3, eyy-es*0.3, es*0.35, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = C.ink; ctx.lineWidth = rs*0.05; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(e2x, eyy, es, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
    } else if (expr === 'happy') {
      ctx.strokeStyle = C.ink; ctx.lineWidth = rs*0.05; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(e1x, eyy+es*0.3, es*0.9, 1.1*Math.PI, 1.9*Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(e2x, eyy+es*0.3, es*0.9, 1.1*Math.PI, 1.9*Math.PI); ctx.stroke();
    } else if (expr === 'surprised') {
      ctx.fillStyle = C.ink;
      ctx.beginPath(); ctx.arc(e1x, eyy, es*1.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2x, eyy, es*1.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(e1x+es*0.3, eyy-es*0.4, es*0.45, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2x+es*0.3, eyy-es*0.4, es*0.45, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = C.ink;
      ctx.beginPath(); ctx.arc(e1x, eyy, es, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2x, eyy, es, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(e1x+es*0.3, eyy-es*0.3, es*0.35, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2x+es*0.3, eyy-es*0.3, es*0.35, 0, Math.PI*2); ctx.fill();
    }
  }
  
  function drawMouth(x, y, rs, expr, happy) {
    ctx.strokeStyle = C.ink; ctx.lineWidth = rs*0.04; ctx.lineCap = 'round';
    if (expr === 'surprised') {
      ctx.beginPath(); ctx.arc(x, y+rs*0.22, rs*0.11, 0, Math.PI*2); ctx.stroke();
    } else if (expr === 'happy' || happy > 0.3) {
      ctx.beginPath(); ctx.arc(x, y+rs*0.12, rs*0.22, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
    } else if (expr === 'sleepy') {
      ctx.beginPath(); ctx.moveTo(x-rs*0.1, y+rs*0.2); ctx.lineTo(x+rs*0.1, y+rs*0.2); ctx.stroke();
    } else if (expr === 'wink') {
      ctx.beginPath(); ctx.arc(x, y+rs*0.15, rs*0.15, 0.2*Math.PI, 0.8*Math.PI); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(x, y+rs*0.15, rs*0.15, 0.2*Math.PI, 0.8*Math.PI); ctx.stroke();
    }
  }
  
  function drawClothing(x, y, rs, type) {
    const by = y + rs*0.35, bh = rs*0.5, bw = rs*1.4;
    if (type === 'tshirt') {
      ctx.fillStyle = '#e05050';
      ctx.beginPath();
      ctx.moveTo(x-bw/2, by-bh/2);
      ctx.quadraticCurveTo(x, by-bh/2-8, x+bw/2, by-bh/2);
      ctx.lineTo(x+bw/2, by+bh/2);
      ctx.quadraticCurveTo(x, by+bh/2+10, x-bw/2, by+bh/2);
      ctx.closePath(); ctx.fill();
    } else if (type === 'hoodie') {
      ctx.fillStyle = '#5080e0';
      ctx.beginPath();
      ctx.moveTo(x-bw/2, by-bh/2);
      ctx.quadraticCurveTo(x, by-bh/2-12, x+bw/2, by-bh/2);
      ctx.lineTo(x+bw/2, by+bh/2);
      ctx.quadraticCurveTo(x, by+bh/2+10, x-bw/2, by+bh/2);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x, by-bh/2-4, bw/3, 8, 0, Math.PI, 0); ctx.fill();
    } else if (type === 'overall') {
      ctx.fillStyle = '#7a9a5a';
      ctx.beginPath();
      ctx.arc(x, y+rs*0.55, rs*1.2, Math.PI*0.15, Math.PI*0.85, false);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#7a9a5a'; ctx.lineWidth = rs*0.08;
      ctx.beginPath(); ctx.moveTo(x-rs*0.35, y+rs*0.4); ctx.lineTo(x-rs*0.25, y-rs*0.05); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+rs*0.35, y+rs*0.4); ctx.lineTo(x+rs*0.25, y-rs*0.05); ctx.stroke();
    }
  }
  
  function drawGlasses(x, y, rs, ex, ey) {
    const eo = rs*0.28, eyy = y-rs*0.1+ey;
    ctx.strokeStyle = '#2a2620'; ctx.lineWidth = rs*0.03;
    ctx.beginPath(); ctx.arc(x-eo+ex, eyy, rs*0.17, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x+eo+ex, eyy, rs*0.17, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-eo+ex+rs*0.17, eyy); ctx.lineTo(x+eo+ex-rs*0.17, eyy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-eo+ex-rs*0.17, eyy); ctx.lineTo(x-rs*0.5, eyy-rs*0.05); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+eo+ex+rs*0.17, eyy); ctx.lineTo(x+rs*0.5, eyy-rs*0.05); ctx.stroke();
  }
  
  function drawScarf(x, y, rs) {
    ctx.fillStyle = '#e06080';
    ctx.beginPath(); ctx.ellipse(x, y+rs*0.65, rs*0.55, rs*0.12, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x+rs*0.3, y+rs*0.65); ctx.lineTo(x+rs*0.5, y+rs*1.05);
    ctx.lineTo(x+rs*0.35, y+rs*1.0); ctx.closePath(); ctx.fill();
  }
  
  function drawBowtie(x, y, rs) {
    const by = y+rs*0.42, bw = rs*0.15;
    ctx.fillStyle = '#a060c0';
    ctx.beginPath(); ctx.moveTo(x-bw*1.5, by); ctx.lineTo(x-bw*0.3, by-bw); ctx.lineTo(x-bw*0.3, by+bw); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+bw*1.5, by); ctx.lineTo(x+bw*0.3, by-bw); ctx.lineTo(x+bw*0.3, by+bw); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(x, by, bw*0.4, 0, Math.PI*2); ctx.fill();
  }
  
  function drawHeadphones(x, y, rs) {
    ctx.strokeStyle = '#2a2620'; ctx.lineWidth = rs*0.06;
    ctx.beginPath(); ctx.arc(x, y-rs*0.15, rs*1.05, -Math.PI*0.85, -Math.PI*0.15); ctx.stroke();
    ctx.fillStyle = '#2a2620';
    ctx.beginPath(); ctx.ellipse(x-rs*0.95, y-rs*0.1, rs*0.12, rs*0.22, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+rs*0.95, y-rs*0.1, rs*0.12, rs*0.22, 0.3, 0, Math.PI*2); ctx.fill();
  }
  
  function drawBackpack(x, y, rs) {
    ctx.strokeStyle = '#8a6a4a'; ctx.lineWidth = rs*0.08;
    ctx.beginPath(); ctx.moveTo(x-rs*0.4, y-rs*0.4); ctx.quadraticCurveTo(x-rs*0.7, y, x-rs*0.4, y+rs*0.4); ctx.stroke();
    ctx.fillStyle = '#a08060';
    ctx.beginPath(); ctx.arc(x-rs*0.55, y, rs*0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8a6a4a';
    ctx.beginPath(); ctx.arc(x-rs*0.55, y+rs*0.15, rs*0.1, 0, Math.PI*2); ctx.fill();
  }
  
  function drawHat(x, y, rs, type) {
    const topY = y - rs*0.9;
    if (type === 'tuque') {
      ctx.fillStyle = '#b5451b';
      ctx.beginPath(); ctx.ellipse(x, topY, rs*0.7, rs*0.35, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#f0f0f0';
      ctx.beginPath(); ctx.ellipse(x, topY, rs*0.7, rs*0.12, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#b5451b';
      ctx.beginPath(); ctx.arc(x, topY-rs*0.35, rs*0.15, 0, Math.PI*2); ctx.fill();
    } else if (type === 'cap') {
      ctx.fillStyle = '#2f6b4f';
      ctx.beginPath(); ctx.ellipse(x, topY, rs*0.75, rs*0.4, 0, Math.PI, 0); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+rs*0.3, topY, rs*0.5, rs*0.1, 0, 0, Math.PI); ctx.fill();
    } else if (type === 'crown') {
      ctx.fillStyle = '#d9a441';
      ctx.beginPath();
      ctx.moveTo(x-rs*0.5, topY); ctx.lineTo(x-rs*0.5, topY-rs*0.35);
      ctx.lineTo(x-rs*0.25, topY-rs*0.15); ctx.lineTo(x, topY-rs*0.45);
      ctx.lineTo(x+rs*0.25, topY-rs*0.15); ctx.lineTo(x+rs*0.5, topY-rs*0.35);
      ctx.lineTo(x+rs*0.5, topY); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e06080';
      ctx.beginPath(); ctx.arc(x, topY-rs*0.15, rs*0.06, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#50a0e0';
      ctx.beginPath(); ctx.arc(x-rs*0.3, topY-rs*0.08, rs*0.05, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+rs*0.3, topY-rs*0.08, rs*0.05, 0, Math.PI*2); ctx.fill();
    } else if (type === 'bow') {
      ctx.fillStyle = '#e06080';
      ctx.beginPath(); ctx.moveTo(x, topY); ctx.lineTo(x-rs*0.4, topY-rs*0.3); ctx.lineTo(x-rs*0.4, topY+rs*0.1); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x, topY); ctx.lineTo(x+rs*0.4, topY-rs*0.3); ctx.lineTo(x+rs*0.4, topY+rs*0.1); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(x, topY, rs*0.1, 0, Math.PI*2); ctx.fill();
    } else if (type === 'flower') {
      ctx.fillStyle = '#e06080';
      for (let i = 0; i < 5; i++) {
        const a = (i/5)*Math.PI*2;
        ctx.beginPath(); ctx.ellipse(x+Math.cos(a)*rs*0.15, topY-rs*0.15+Math.sin(a)*rs*0.15, rs*0.15, rs*0.08, a, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = '#e0c040';
      ctx.beginPath(); ctx.arc(x, topY-rs*0.15, rs*0.1, 0, Math.PI*2); ctx.fill();
    }
  }
  
  // ─── SCENE HELPERS ───
  function drawSky() {

  function drawTreeAutumn(x, y, s = 1) {
    ctx.fillStyle = '#6a4a2a'; ctx.fillRect(x-4*s, y-20*s, 8*s, 20*s);

  function drawCloud(x, y, s = 1) {

  // ─── STORIES ───
  function drawSceneLac() {
    drawSky();
    ctx.fillStyle = '#a8d4e0'; ctx.fillRect(0, H*0.5, W, H*0.28);
    drawGround(H*0.78);

      }

  function drawSceneSwim() {
    drawSky();
    ctx.fillStyle = '#5a9bb5'; ctx.fillRect(0, H*0.4, W, H*0.6);
    for (let i = 0; i < 8; i++) {
      const x = (i*83 + performance.now()/50) % W;
      const y = H*0.5 + Math.sin(performance.now()/1000 + i)*30 + i*20;
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#6a4a3a';
    ctx.beginPath(); ctx.ellipse(450, H*0.55, 30, 18, 0, 0, Math.PI*2); ctx.fill();

  function initAventure() {
    const todo = STORIES.filter(s => !finished.has(s.id));
    const pool = todo.length ? todo : STORIES;
    aventure.story = pool[Math.floor(Math.random() * pool.length)];
    aventure.scene = 0;
    updateAventureUI();
  }
  
  function updateAventureUI() {
    [...ui.children].forEach(c => {
      if (!c.classList.contains('btn-back') && !c.classList.contains('btn-sound')) c.remove();
    });
    if (!aventure.story) return;
    const scene = aventure.story.scenes[aventure.scene];
    const textDiv = document.createElement('div');
    textDiv.className = 'story-text';
    const h2 = document.createElement('h2');
    h2.textContent = aventure.story.title + (finished.has(aventure.story.id) ? ' ✓' : '');
    const p = document.createElement('p');
    p.textContent = scene.text;
    textDiv.appendChild(h2); textDiv.appendChild(p);
    ui.appendChild(textDiv);
    const panel = document.createElement('div');
    panel.className = 'choice-panel';
    scene.choices.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.textContent = c.text;
      btn.addEventListener('click', () => {
        playNote(523 + i*80, 0.15);
        if (c.end) { markFinished(aventure.story.id); exitScreen(); }
        else { aventure.scene = c.next; updateAventureUI(); }
      });
      panel.appendChild(btn);
    });
    ui.appendChild(panel);
  }
  
  function renderAventure() {
    if (!aventure.story) return;
    aventure.story.scenes[aventure.scene].draw();
  }

  function updateHub() {
    if (hub.selected) {
      const d = hub.doors.find(x => x.id === hub.selected);
      blob.targetX = d.x; blob.targetY = d.y + 45;
    } else {
      blob.targetX = W/2; blob.targetY = H*0.7;
    }
    blob.x += (blob.targetX - blob.x) * 0.08;
    blob.y += (blob.targetY - blob.y) * 0.08;
    if (blob.purr > 0) blob.purr = Math.max(0, blob.purr - 0.02);
    if (blob.happy > 0) blob.happy = Math.max(0, blob.happy - 0.01);
  }
  
  function renderHub() {
    drawSky();
    ctx.fillStyle = '#a8c8a0';
    ctx.beginPath(); ctx.ellipse(150, 350, 200, 80, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(500, 350, 200, 80, 0, 0, Math.PI*2); ctx.fill();
    drawCloud(80, 80, 1); drawCloud(300, 60, 1.2); drawCloud(520, 90, 0.9);
    drawGround(340);
    drawTree(60, 375, 1); drawTree(585, 365, 1.1);
    // Blob derrière les portes : la porte Chambre (320,290) n'est plus masquée.
    drawBlob(blob.x, blob.y, blob.r, { eyeX: blob.eyeX, eyeY: blob.eyeY, purr: blob.purr, happy: blob.happy });
    for (const d of hub.doors) {
      const pulse = 1 + Math.sin(performance.now()/800 + d.x)*0.05;
      const r = 32 * pulse;
      const gr = ctx.createRadialGradient(d.x, d.y, 5, d.x, d.y, r*1.5);

    const nextChapter = CHAPTERS.find(ch => ch.ids.some(id => !finished.has(id)));
    const nextStory = STORIES.find(s => !finished.has(s.id));
    const label = nextChapter
      ? `Chapitre ${CHAPTERS.indexOf(nextChapter) + 1} — ${nextChapter.title} · ${done} sur ${total} histoires`

    addRow(panel, 'Accessoire', ACCESS.map((a, i) => ({
      content: ACCESS_ICONS[i], active: custom.accessory === i, label: ACCESS_LABELS[i],
      onClick: () => { custom.accessory = i; saveCustom(); updateAtelierUI(); playNote(650 + i*30, 0.1); }
    })));
    // Vêtement
    addRow(panel, 'Vêtement', CLOTHING.map((c, i) => ({
      content: CLOTHING_ICONS[i], active: custom.clothing === i, label: CLOTHING_LABELS[i],
      onClick: () => { custom.clothing = i; saveCustom(); updateAtelierUI(); playNote(700 + i*30, 0.1); }
    })));
    // Visage
    addRow(panel, 'Visage', EXPRESSIONS.map((e, i) => ({
      content: EXPR_ICONS[i], active: custom.expression === i, title: EXPR_LABELS[i], label: EXPR_LABELS[i],
      onClick: () => { custom.expression = i; saveCustom(); updateAtelierUI(); playNote(750 + i*30, 0.1); }
    })));
    
    ui.appendChild(panel);
  }
  function addRow(panel, label, options) {
    const row = document.createElement('div');
    row.className = 'atelier-row';
    const lbl = document.createElement('span');
    lbl.className = 'atelier-label';
    lbl.textContent = label;
    row.appendChild(lbl);
    const opts = document.createElement('div');
    opts.className = 'atelier-options';
    options.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o.content;
      if (o.cls) b.classList.add(o.cls);
      if (o.bg) b.style.background = o.bg;
      if (o.active) b.classList.add('sel');
      if (o.title) b.title = o.title;
      if (o.label) b.setAttribute('aria-label', o.label);
      b.addEventListener('click', o.onClick);
      opts.appendChild(b);
    });
    row.appendChild(opts);
    panel.appendChild(row);
  }
  function renderAtelier() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#f0e8f8'); g.addColorStop(1, '#e8e8f0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 12; i++) {
      const a = (i/12)*Math.PI*2 + performance.now()/3000;
      ctx.fillStyle = `rgba(255,220,240,${0.2 + Math.sin(i)*0.1})`;
      ctx.beginPath(); ctx.arc(W/2 + Math.cos(a)*180, H*0.32 + Math.sin(a)*100, 30, 0, Math.PI*2); ctx.fill();
    }
    // Miroir
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.ellipse(W/2, H*0.32, 130, 110, 0, 0, Math.PI*2); ctx.fill();
    drawBlob(W/2, H*0.32, 75, { happy: blob.happy });
    // Instruction
    ctx.fillStyle = 'rgba(47,107,79,0.6)'; ctx.font = 'italic 13px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('Choisis ce qui te plaît. Tu peux tout changer.', W/2, H*0.62);
  }
  
  // ─── CHAMBRE ───
  const chambre = { zone: 'free', targetX: W/2, targetY: H*0.72, zzzTimer: 0 };
  const CHAMBRE_ZONES = {
    window: { x: 145, y: 260, icon: '🪟', label: 'Regarder dehors' },
    bed:    { x: W-130, y: H*0.58, icon: '🛏️', label: 'Dormir' },
    rug:    { x: W/2, y: H*0.8, icon: '🟡', label: 'Danser' }
  };
  function initChambre() {
    chambre.zone = 'free';
    blob.x = W/2; blob.y = H*0.68;
    blob.targetX = W/2; blob.targetY = H*0.68;
    blob.purr = 0; blob.happy = 0;
  }
  function updateChambre(dt) {
    blob.x += (blob.targetX - blob.x) * 0.1;
    blob.y += (blob.targetY - blob.y) * 0.1;
    if (blob.purr > 0) blob.purr = Math.max(0, blob.purr - 0.02);
    if (chambre.zone === 'rug') {
      blob.bounce = Math.abs(Math.sin(performance.now()/300)) * 8;
    } else {
      blob.bounce = Math.max(0, blob.bounce - 1);
    }
    if (chambre.zone === 'bed') {
      chambre.zzzTimer += dt;
      if (chambre.zzzTimer > 0.8) {
        chambre.zzzTimer = 0;
        particles.push({ x: blob.x + 30, y: blob.y - 20, vx: 0.3, vy: -0.8,
          life: 1, color: 'rgba(100,140,180,0.7)', size: 8 });
      }
    }
  }
  function renderChambre() {
    // Mur
    ctx.fillStyle = '#e8d8c0'; ctx.fillRect(0, 0, W, H*0.68);
    for (let i = 0; i < 20; i++) {
      for (let j = 0; j < 5; j++) {
        ctx.fillStyle = 'rgba(200,180,150,0.25)';
        ctx.beginPath(); ctx.arc(30 + i*33, 30 + j*40, 2.5, 0, Math.PI*2); ctx.fill();
      }
    }
    // Plancher
    ctx.fillStyle = '#a08060'; ctx.fillRect(0, H*0.68, W, H*0.32);
    ctx.strokeStyle = '#8a6a4a'; ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      ctx.beginPath();
      ctx.moveTo(0, H*0.68 + i*20); ctx.lineTo(W, H*0.68 + i*20); ctx.stroke();
    }
    // Fenêtre
    const wx = 80, wy = 90, ww = 130, wh = 130;
    const sky = ctx.createLinearGradient(wx, wy, wx, wy + wh);
    sky.addColorStop(0, '#a8d4e0'); sky.addColorStop(1, '#e8e0c8');
    ctx.fillStyle = sky;
    ctx.fillRect(wx, wy, ww, wh);
    // Soleil
    ctx.fillStyle = '#f0e080';
    ctx.beginPath(); ctx.arc(wx + ww*0.7, wy + 35, 16, 0, Math.PI*2); ctx.fill();
    // Nuage
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(wx + 30, wy + 40, 12, 0, Math.PI*2);
    ctx.arc(wx + 45, wy + 38, 15, 0, Math.PI*2);
    ctx.arc(wx + 60, wy + 40, 12, 0, Math.PI*2); ctx.fill();
    // Cadre
    ctx.strokeStyle = '#6a4a2a'; ctx.lineWidth = 6;
    ctx.strokeRect(wx, wy, ww, wh);
    ctx.beginPath();
    ctx.moveTo(wx + ww/2, wy); ctx.lineTo(wx + ww/2, wy + wh);
    ctx.moveTo(wx, wy + wh/2); ctx.lineTo(wx + ww, wy + wh/2);
    ctx.stroke();
    // Lit
    const bx = W - 220, by = H*0.52;
    ctx.fillStyle = '#6a4a2a'; ctx.fillRect(bx, by - 20, 180, 60);
    ctx.fillStyle = '#f0e8d0';
    ctx.beginPath(); ctx.roundRect(bx - 10, by + 30, 200, 55, 8); ctx.fill();
    ctx.fillStyle = '#fffdf7';
    ctx.beginPath(); ctx.ellipse(bx + 40, by + 45, 32, 18, -0.1, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#a8c8e0';
    ctx.beginPath(); ctx.roundRect(bx + 20, by + 40, 170, 70, 8); ctx.fill();
    ctx.strokeStyle = '#88a8c0'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(bx + 30, by + 55 + i*15);
      ctx.lineTo(bx + 180, by + 55 + i*15);
      ctx.stroke();
    }
    // Tapis
    ctx.fillStyle = '#e0c890';
    ctx.beginPath(); ctx.ellipse(W/2, H*0.82, 140, 40, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#c0a870'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(W/2, H*0.82, 120, 32, 0, 0, Math.PI*2); ctx.stroke();
    // Étagère
    ctx.fillStyle = '#7a5a3a'; ctx.fillRect(W-80, 100, 60, 130);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = '#6a4a2a'; ctx.fillRect(W-80, 100 + i*45 + 40, 60, 4);
      for (let j = 0; j < 4; j++) {
        ctx.fillStyle = ['#e05050','#5080e0','#e0c040','#50a050'][j];
        ctx.fillRect(W-75 + j*13, 100 + i*45 + 10, 10, 30);
      }
    }
    // Blob (avec bounce)
    const by2 = blob.y - blob.bounce;
    const expr = chambre.zone === 'bed' ? 'sleepy' :
                 chambre.zone === 'rug' ? 'happy' :
                 chambre.zone === 'window' ? 'surprised' : null;
    drawBlob(blob.x, by2, blob.r, { purr: blob.purr, exprOverride: expr });
    // Indication des zones
    if (chambre.zone === 'free') {
      ctx.fillStyle = 'rgba(47,107,79,0.45)'; ctx.font = 'italic 13px system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('Touche la fenêtre, le lit ou le tapis.', W/2, H-8);
    }
  }
  function handleChambreClick(x, y) {
    // Vérifie les zones
    if (Math.hypot(x - 145, y - 155) < 90) {
      chambre.zone = 'window';
      blob.targetX = CHAMBRE_ZONES.window.x;
      blob.targetY = CHAMBRE_ZONES.window.y;
      playNote(700, 0.2);
      return;
    }
    const bx = W - 130, by = H*0.58;
    if (x > bx - 100 && x < bx + 100 && y > by - 60 && y < by + 100) {
      chambre.zone = 'bed';
      blob.targetX = CHAMBRE_ZONES.bed.x;
      blob.targetY = CHAMBRE_ZONES.bed.y;
      playNote(440, 0.3);
      return;
    }
    if (Math.hypot(x - W/2, y - H*0.82) < 90) {
      chambre.zone = 'rug';
      blob.targetX = CHAMBRE_ZONES.rug.x;
      blob.targetY = CHAMBRE_ZONES.rug.y - 10;
      playNote(600, 0.2);
      return;
    }
    if (Math.hypot(x - blob.x, y - blob.y) < blob.r + 15) {
      blob.purr = 1; addHug();
      playNote(440, 0.15);
      return;
    }
    // Déplacement libre
    chambre.zone = 'free';
    blob.targetX = Math.max(blob.r + 10, Math.min(W - blob.r - 10, x));
    blob.targetY = Math.max(H*0.68 + 10, Math.min(H - blob.r - 10, y));
  }
  
  // ─── INPUT ───
  let pointerDown = false;
  function coords(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const { x, y } = coords(e);
    pointerDown = true;
    if (screen === 'hub') handleHubClick(x, y);
    else if (screen === 'calin') handleCalinInput(x, y, 'down');
    else if (screen === 'couleurs') handleCouleursClick(x, y);
    else if (screen === 'dessin') handleDessinInput(x, y, 'down');
    else if (screen === 'jardin') handleJardinClick(x, y);
    else if (screen === 'chambre') handleChambreClick(x, y);
  });
  canvas.addEventListener('pointermove', e => {
    if (!pointerDown) return;
    const { x, y } = coords(e);
    if (screen === 'calin') handleCalinInput(x, y, 'move');
    else if (screen === 'dessin') handleDessinInput(x, y, 'move');
  });
  function endPointer() {
    if (!pointerDown) return;
    pointerDown = false;
    if (screen === 'calin') handleCalinInput(0, 0, 'up');
    else if (screen === 'dessin') handleDessinInput(0, 0, 'up');
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointerleave', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  
  // ─── NAVIGATION ───
  function addChromeButtons() {
    const back = document.createElement('button');
    back.className = 'btn btn-back';
    back.textContent = 'Retour';
    back.addEventListener('click', function(){ if (screen === 'hub') { location.href = '/jeux'; } else { exitScreen(); } });
    ui.appendChild(back);
    const snd = document.createElement('button');
    snd.className = 'btn btn-sound';
    snd.textContent = settings.sound ? '🔊' : '🔇';
    snd.setAttribute('aria-label', 'Son');
    snd.addEventListener('click', () => {
      settings.sound = !settings.sound; saveSettings();
      snd.textContent = settings.sound ? '🔊' : '🔇';
    });
    ui.appendChild(snd);
  }
  
  function enterScreen(id) {
    screen = id;
    hub.selected = null;
    ui.innerHTML = '';
    addChromeButtons();
    // Gepeto vrai : face visible sur le hub seulement — dans une histoire, le panneau
    // de titre occupe l'en-tête et une face de 48 px masquerait le titre.
    var gf = document.querySelector('.gepeto-face'); if (gf) gf.classList.toggle('cache', id !== 'hub');
    if (id === 'calin') initCalin();
    else if (id === 'aventure') initAventure();
    else if (id === 'couleurs') initCouleurs();
    else if (id === 'dessin') initDessin();
    else if (id === 'jardin') initJardin();
    else if (id === 'atelier') initAtelier();
    else if (id === 'chambre') initChambre();
  }
  
  function exitScreen() {
    screen = 'hub';
    ui.innerHTML = '';
    var gf2 = document.querySelector('.gepeto-face'); if (gf2) gf2.classList.remove('cache');
    // Trait de dessin en cours : le commettre avant de quitter (sinon perdu).
    if (dessin.currentStroke) {
      dessin.strokes.push(dessin.currentStroke);
      if (dessin.strokes.length > 300) dessin.strokes.shift();
      try { localStorage.setItem(KEYS.dessin, JSON.stringify(dessin.strokes)); } catch { }
      dessin.currentStroke = null;
    }
    if (calin.holdTimer) { clearTimeout(calin.holdTimer); calin.holdTimer = null; }
    calin.pointerDown = false;
    chambre.zone = 'free'; chambre.zzzTimer = 0;
    blob.breathing = false; blob.breathTime = 0; blob.bounce = 0; blob.purr = 0; blob.happy = 0;
    // Réinitialise blob au centre
    blob.x = W/2; blob.y = H*0.7;
    blob.targetX = W/2; blob.targetY = H*0.7;
  }
  
  // ─── MAIN LOOP ───
  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    if (screen === 'hub') updateHub();
    else if (screen === 'calin') updateCalin(dt);
    else if (screen === 'chambre') updateChambre(dt);
    else if (screen === 'atelier') {
      blob.x += (blob.targetX - blob.x) * 0.1;
      blob.y += (blob.targetY - blob.y) * 0.1;
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.vx *= 0.98; p.life -= 0.02;
      if (p.life <= 0) particles.splice(i, 1);
    }
    if (particles.length > 120) particles.splice(0, particles.length - 120);
    ctx.clearRect(0, 0, W, H);
    if (screen === 'hub') renderHub();
    else if (screen === 'calin') renderCalin();
    else if (screen === 'aventure') renderAventure();
    else if (screen === 'couleurs') renderCouleurs();
    else if (screen === 'dessin') renderDessin();
    else if (screen === 'jardin') renderJardin();
    else if (screen === 'atelier') renderAtelier();
    else if (screen === 'chambre') renderChambre();
    for (const p of particles) {
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
