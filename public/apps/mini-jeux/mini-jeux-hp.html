<title>Mini-jeux HP</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#f2ecdf;font:18px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px}
h1{font-size:1.15rem;margin:0}
#tete{width:48px;height:48px;border-radius:50%;flex:none}
a{color:#ffd66b}
button{font:inherit;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid #2a3a4a;background:#0b141d;color:#f2ecdf}
button:focus-visible{outline:3px solid #ffd66b;outline-offset:2px}
#menu{padding:8px 14px 24px;display:grid;gap:12px;align-content:start}
#menu button{min-height:84px;font-size:1.25rem;text-align:left;display:flex;gap:14px;align-items:center}
#menu span{font-size:2rem}
.n{opacity:.7;font-size:.9rem;padding:0 14px}
#jeu{flex:1;display:flex;flex-direction:column;min-height:0}
#zone{flex:1;position:relative;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bas{display:flex;gap:10px;padding:10px 14px;min-height:20px}
[hidden]{display:none!important}
</style>

<body>
<header><button id="back" hidden aria-label="Retour au menu">←</button><img id="tete" src="gepeto-tete-144.png" width="48" height="48" alt="Sir H. Gepeto"><h1 id="t">Mini-jeux HP</h1></header>
<main id="menu"></main>
<p class="n" id="note">Trois mini-jeux gratuits, jouables hors ligne : Hiverman, Flocon et Mini point.<br>Aucun son. Aucun réseau. Fond noir pour économiser la pile.<br>🧰 HP — des outils pour la vraie vie.<br><a href="https://www.hp-outils.com/jeux">Plus de jeux gratuits sur hp-outils.com</a></p>
<section id="jeu" hidden><div id="zone"><canvas id="c"></canvas></div><div id="bas"></div></section>

<script>
(()=>{
const $=s=>document.querySelector(s),cv=$("#c"),g=cv.getContext("2d"),zone=$("#zone");
let W0=null,H0=null,cur=null;
function taille(){const r=zone.getBoundingClientRect();if(r.width!==W0||r.height!==H0){W0=r.width;H0=r.height;const d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);g.setTransform(d,0,0,d,0,0)}return[W0,H0]}
function btn(t,f){const b=document.createElement("button");b.textContent=t;b.onclick=f;$("#bas").append(b)}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}

const J={
hiverman:{nom:"Hiverman",ic:"⛄",
go(){const T=this,M=["###########","#.........#","#.##.#.##.#","#.........#","#.##.#.##.#","#.........#","#.##.#.##.#","#.........#","###########"],C=11,L=9;
let p,gs,pts,want,fin,n,sx=null,sy;
const lib=(x,y)=>M[y][x]!=="#";
function init(){p={x:1,y:7,dx:0,dy:0};gs=[{x:9,y:1},{x:5,y:3}];pts=new Set();
M.forEach((r,y)=>[...r].forEach((c,x)=>{if(c==="."&&!(x===1&&y===7))pts.add(x+","+y)}));want={x:0,y:0};fin=0;n=0;dessiner()}
function dessiner(){const[w,h]=taille(),s=Math.min(w/C,h/L),ox=(w-s*C)/2,oy=(h-s*L)/2;
g.fillStyle="#000";g.fillRect(0,0,w,h);
M.forEach((r,y)=>[...r].forEach((c,x)=>{if(c==="#"){g.fillStyle="#12304a";g.fillRect(ox+x*s+1,oy+y*s+1,s-2,s-2)}}));
g.fillStyle="#f2ecdf";pts.forEach(k=>{const[x,y]=k.split(",");g.beginPath();g.arc(ox+(+x+.5)*s,oy+(+y+.5)*s,s*.08,0,7);g.fill()});
g.fillStyle="#7fd0ff";gs.forEach(q=>g.fillRect(ox+q.x*s+s*.15,oy+q.y*s+s*.15,s*.7,s*.7));
g.fillStyle="#fff";g.beginPath();g.arc(ox+(p.x+.5)*s,oy+(p.y+.5)*s,s*.38,0,7);g.fill();
g.fillStyle="#ff8a1c";g.beginPath();g.arc(ox+(p.x+.5+p.dx*.3)*s,oy+(p.y+.5+p.dy*.3)*s,s*.08,0,7);g.fill();
if(fin){g.fillStyle="#ffd66b";g.textAlign="center";g.font="700 "+s*.9+"px system-ui";g.fillText(fin===2?"Bravo!":"Touché!",w/2,h/2);g.font="500 "+s*.4+"px system-ui";g.fillText("Touchez pour rejouer",w/2,h/2+s)}}
function tick(){if(fin)return;n++;
if((want.x||want.y)&&lib(p.x+want.x,p.y+want.y)){p.dx=want.x;p.dy=want.y}
if(lib(p.x+p.dx,p.y+p.dy)){p.x+=p.dx;p.y+=p.dy}else{p.dx=0;p.dy=0}
pts.delete(p.x+","+p.y);
if(n%2===0)gs.forEach(q=>{const o=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>lib(q.x+d[0],q.y+d[1]));let c=o[Math.random()*o.length|0];
if(Math.random()<.6)c=o.reduce((a,b)=>Math.hypot(q.x+b[0]-p.x,q.y+b[1]-p.y)<Math.hypot(q.x+a[0]-p.x,q.y+a[1]-p.y)?b:a);
q.x+=c[0];q.y+=c[1]});
if(gs.some(q=>q.x===p.x&&q.y===p.y))fin=1;else if(!pts.size)fin=2;
dessiner()}
cv.onpointerdown=e=>{if(fin){init();return}sx=e.clientX;sy=e.clientY};
cv.onpointermove=e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>24){want=Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)};sx=null}};
cv.onpointerup=()=>{sx=null};
init();T.t=setInterval(()=>{if(!document.hidden)tick()},280)},
stop(){clearInterval(this.t)}},

flocon:{nom:"Flocon",ic:"❄️",
go(){let s=[1,2,0,3,1],R=1;
function dessiner(){const[w,h]=taille();R=Math.min(w,h)*.46;const cx=w/2,cy=h/2;
g.fillStyle="#000";g.fillRect(0,0,w,h);g.strokeStyle="#bfe6ff";g.lineWidth=3;g.lineCap="round";g.lineJoin="round";
for(let k=0;k<6;k++){g.save();g.translate(cx,cy);g.rotate(k*Math.PI/3);g.beginPath();g.moveTo(0,0);g.lineTo(R,0);g.stroke();
s.forEach((t,i)=>{const x=R*(i+1)/6,L=R/9;g.beginPath();
if(t===1){g.moveTo(x,0);g.lineTo(x+L*.7,L);g.moveTo(x,0);g.lineTo(x+L*.7,-L)}
if(t===2){g.moveTo(x-L*.6,0);g.lineTo(x,L*.6);g.lineTo(x+L*.6,0);g.lineTo(x,-L*.6);g.closePath()}
if(t===3){g.arc(x,0,L*.5,0,7)}
if(t===4){g.moveTo(x-L,L*.7);g.lineTo(x,0);g.lineTo(x-L,-L*.7)}
g.stroke()});g.restore()}
g.fillStyle="#ffd66b";g.font="500 16px system-ui";g.textAlign="center";g.fillText("Touchez un bras pour changer la pièce",cx,h-14)}
cv.onpointerdown=e=>{const[x,y]=pos(e),dx=x-W0/2,dy=y-H0/2,i=Math.round(Math.hypot(dx,dy)/(R/6))-1;if(i>=0&&i<5){s[i]=(s[i]+1)%5;dessiner()}};
btn("Au hasard",()=>{s=s.map(()=>Math.random()*5|0);dessiner()});dessiner()}},

point:{nom:"Mini point",ic:"•",
go(){const[w,h]=taille(),oc=document.createElement("canvas"),d=cv.width/w;oc.width=cv.width;oc.height=cv.height;const o=oc.getContext("2d");o.setTransform(d,0,0,d,0,0);
let px=null,py=0,x=null,y=0;
function voir(){g.fillStyle="#000";g.fillRect(0,0,w,h);g.drawImage(oc,0,0,w,h);if(x!==null){g.fillStyle="#ffd66b";g.beginPath();g.arc(x,y,7,0,7);g.fill()}}
cv.onpointerdown=e=>{[x,y]=pos(e);px=x;py=y;voir()};
cv.onpointermove=e=>{if(px===null)return;[x,y]=pos(e);o.strokeStyle="#ffd66b";o.lineWidth=4;o.lineCap="round";o.beginPath();o.moveTo(px,py);o.lineTo(x,y);o.stroke();px=x;py=y;voir()};
cv.onpointerup=()=>{px=null};
btn("Effacer",()=>{o.clearRect(0,0,w,h);x=null;voir()});voir()}}
};

const menu=$("#menu");
Object.keys(J).forEach(k=>{const b=document.createElement("button");b.innerHTML="<span>"+J[k].ic+"</span>"+J[k].nom;b.onclick=()=>ouvrir(k);menu.append(b)});
function ouvrir(k){menu.hidden=true;$("#note").hidden=true;$("#jeu").hidden=false;$("#back").hidden=false;$("#bas").innerHTML="";W0=null;H0=null;$("#t").textContent=J[k].nom;cur=J[k];cur.go()}
function fermer(){if(cur&&cur.stop)cur.stop();cur=null;cv.onpointerdown=cv.onpointermove=cv.onpointerup=null;$("#jeu").hidden=true;$("#back").hidden=true;menu.hidden=false;$("#note").hidden=false;$("#t").textContent="Mini-jeux HP"}
$("#back").onclick=fermer;
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
