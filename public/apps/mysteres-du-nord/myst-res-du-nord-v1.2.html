<style>
/* ============ MYSTÈRES DU NORD — tableau d'enquête ============ */
* { box-sizing: border-box; }
:root{
  --font-disp: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --font-round: ui-rounded,"SF Pro Rounded","Segoe UI Rounded","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --font-body: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  --board:#251b11; --board2:#191007;
  --ink:#f2e8d6; --muted:#c9b793; --faint:#8f7c5e;
  --card:#2f2416; --card2:#372a19; --line:rgba(242,232,214,.13);
  --paper:#f6eeda; --paper2:#efe2c8; --paper-ink:#3a2c1c; --paper-mut:#7a6647;
  --accent:#e0665a; --accent-deep:#b8453c; --gold:#e8b64c; --gold-deep:#b98a2e;
  --ok:#8fca8a; --ok-deep:#4e8a4a; --bad:#e8786b; --info:#7fb6d9;
  --tabbar:#1b130a; --tab-active:#e8b64c;
  --shadow:0 10px 28px rgba(0,0,0,.42);
  --radius:12px;
}
@media (prefers-color-scheme: light){
  :root{
    --board:#d9c29c; --board2:#c3a87e;
    --ink:#2f2415; --muted:#5d4c35; --faint:#8a7556;
    --card:#f2e8d3; --card2:#e9dcc0; --line:rgba(47,36,21,.16);
    --tabbar:#efe3c9; --tab-active:#a9761f;
    --shadow:0 10px 24px rgba(60,42,20,.25);
  }
}
/* palette enfant : plus douce et colorée */
body.palette-kid{
  --accent:#e8734a; --accent-deep:#c15a33; --gold:#f2c14e; --gold-deep:#c9942b;
  --radius:18px;
}
body.palette-kid h1, body.palette-kid h2, body.palette-kid .disp{ font-family:var(--font-round); letter-spacing:0; }

html,body{ height:100%; }
body{
  margin:0; font-family:var(--font-body); color:var(--ink);
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(255,235,200,.07), transparent 60%),
    radial-gradient(900px 700px at 110% 10%, rgba(0,0,0,.28), transparent 55%),
    radial-gradient(2px 2px at 12% 30%, rgba(255,255,255,.05), transparent 60%),
    repeating-radial-gradient(circle at 78% 62%, rgba(255,255,255,.028) 0 1px, transparent 1px 5px),
    repeating-radial-gradient(circle at 30% 80%, rgba(0,0,0,.05) 0 1px, transparent 1px 4px),
    linear-gradient(160deg, var(--board), var(--board2));
  background-color:var(--board2);
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme: light){
  body{ background:
    radial-gradient(1200px 600px at 20% -10%, rgba(255,255,255,.5), transparent 60%),
    repeating-radial-gradient(circle at 78% 62%, rgba(120,90,50,.06) 0 1px, transparent 1px 5px),
    repeating-radial-gradient(circle at 30% 80%, rgba(255,255,255,.25) 0 1px, transparent 1px 4px),
    linear-gradient(160deg, var(--board), var(--board2)); }
}

h1,h2,h3{ font-family:var(--font-disp); margin:0 0 .4em; letter-spacing:.01em; }
p{ margin:0 0 .8em; line-height:1.55; }
button{ font-family:inherit; cursor:pointer; }
svg.ic{ width:1.25em; height:1.25em; vertical-align:-.28em; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* ---------- coquille ---------- */
#app{ min-height:100dvh; display:flex; flex-direction:column; max-width:1120px; margin:0 auto; }
.view{ flex:1; padding:clamp(14px,3vw,30px); padding-bottom:calc(96px + env(safe-area-inset-bottom)); animation:fadein .28s ease; }
body.no-nav .view{ padding-bottom:clamp(24px,4vw,44px); }
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

/* ---------- accueil ---------- */
.hero{ text-align:center; position:relative; padding:clamp(18px,4vw,44px) 6px 10px; }
.hero .thread{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.hero h1{ font-size:clamp(40px,8vw,76px); color:var(--ink); margin-bottom:.05em; text-wrap:balance; }
.hero h1 .thin{ font-weight:500; }
.hero .sub{ color:var(--muted); font-size:clamp(15px,2.4vw,19px); max-width:640px; margin:0 auto 6px; line-height:1.5; }
.goalstrip{ max-width:720px; margin:18px auto 6px; background:var(--paper); color:var(--paper-ink);
  border-radius:var(--radius); padding:14px 18px 14px 56px; position:relative; box-shadow:var(--shadow); text-align:left; }
.goalstrip::before{ content:""; position:absolute; top:-9px; left:30px; width:18px; height:18px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff9a8a, #c0392b 60%, #7c1f16); box-shadow:0 3px 6px rgba(0,0,0,.4); }
.goalstrip strong{ color:var(--accent-deep); }
.cases{ display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); margin-top:26px; }
.case{ background:var(--paper); color:var(--paper-ink); border-radius:var(--radius); padding:22px 20px 20px;
  position:relative; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px; transition:transform .18s ease; }
.case:nth-child(odd){ transform:rotate(-.7deg); } .case:nth-child(even){ transform:rotate(.6deg); }
.case:hover{ transform:rotate(0) translateY(-3px); }
.case::before{ content:""; position:absolute; top:-9px; left:50%; transform:translateX(-50%); width:20px; height:20px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffe1a1, var(--gold) 60%, var(--gold-deep)); box-shadow:0 3px 6px rgba(0,0,0,.4); }
.case .tagchip{ display:inline-block; align-self:flex-start; background:var(--accent-deep); color:#fff; font-size:12px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; padding:5px 12px; border-radius:999px; }
.case.kid .tagchip{ background:#2f8f5b; } .case.detective .tagchip{ background:#3a3f52; }
@media (prefers-color-scheme: light){ .case.detective .tagchip{ background:#3a3f52; color:#fff; } }
.case h2{ font-size:26px; margin:2px 0 0; }
.case .desc{ color:var(--paper-mut); font-size:15px; flex:1; }
.case .goal{ font-size:14px; border-top:1px dashed var(--paper-mut); padding-top:10px; margin:0; }
.case .goal b{ color:var(--accent-deep); }
.howto{ max-width:760px; margin:30px auto 8px; color:var(--muted); font-size:14.5px; }
.howto ol{ margin:8px 0 0; padding-left:22px; } .howto li{ margin:6px 0; line-height:1.5; }

/* ---------- reprise d'enquête sauvegardée ---------- */
.resumebar{ max-width:760px; margin:4px auto 22px; background:#2a2132; border:1.5px solid var(--gold); border-radius:var(--radius);
  padding:16px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; box-shadow:var(--shadow); position:relative; text-align:left; }
.resumebar::before{ content:""; position:absolute; top:-9px; left:34px; width:18px; height:18px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffe1a1, var(--gold) 60%, var(--gold-deep)); box-shadow:0 3px 6px rgba(0,0,0,.4); }
.resumebar .ri{ flex:1; min-width:min(260px,100%); }
.resumebar .disptitle{ font-family:var(--font-disp); font-size:19px; font-weight:700; color:var(--gold); display:flex; align-items:center; gap:10px; }
.resumebar p{ margin:6px 0 0; font-size:14px; color:#cfc3ad; }
.resumebar .rbtns{ display:flex; gap:10px; flex-wrap:wrap; margin-left:auto; }

/* ---------- boutons ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:9px; border:0; border-radius:14px;
  padding:13px 22px; font-size:16px; font-weight:700; color:#20160a; background:linear-gradient(180deg,var(--gold),var(--gold-deep));
  box-shadow:0 4px 14px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.35); transition:transform .12s ease, filter .12s; text-decoration:none; }
.btn:hover{ transform:translateY(-1px); filter:brightness(1.06); } .btn:active{ transform:translateY(1px); }
.btn.secondary{ background:var(--card); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line); font-weight:600; }
.btn.danger{ background:linear-gradient(180deg,#e0655a,#b8453c); color:#fff; }
.btn.small{ padding:8px 14px; font-size:14px; border-radius:11px; }
.btn.block{ display:flex; width:100%; }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
.linkbtn{ background:none; border:0; color:var(--muted); font-size:14.5px; padding:6px 4px; text-decoration:underline; text-underline-offset:3px; }
.linkbtn:hover{ color:var(--ink); }

/* ---------- briefing ---------- */
.brief{ max-width:700px; margin:0 auto; }
.brief .paper{ background:var(--paper); color:var(--paper-ink); border-radius:var(--radius); padding:clamp(20px,4vw,36px);
  box-shadow:var(--shadow); position:relative; }
.brief .paper::before{ content:""; position:absolute; top:-9px; left:50%; transform:translateX(-50%); width:20px; height:20px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff9a8a, #c0392b 60%, #7c1f16); box-shadow:0 3px 6px rgba(0,0,0,.4); }
.brief h1{ font-size:clamp(30px,6vw,46px); }
.brief .intro{ font-size:clamp(16px,2.6vw,19px); font-style:italic; color:var(--paper-mut); border-left:4px solid var(--accent-deep); padding-left:14px; }
.brief .goalbox{ background:rgba(200,57,43,.08); border:1.5px dashed var(--accent-deep); border-radius:12px; padding:12px 16px; margin:16px 0; }
.brief .goalbox b{ color:var(--accent-deep); }
.brief .timeline{ list-style:none; padding:0; margin:12px 0; }
.brief .timeline li{ display:flex; gap:12px; padding:7px 0; border-bottom:1px dashed rgba(122,102,71,.35); font-size:15px; }
.brief .timeline time{ font-weight:800; min-width:60px; color:var(--accent-deep); font-variant-numeric:tabular-nums; }
.brief .rules{ background:#2c2333; color:#efe6d8; border-radius:12px; padding:14px 18px; font-size:15.5px; margin:16px 0;
  border:1.5px solid var(--gold); }
@media (prefers-color-scheme: light){ .brief .rules{ background:#33283a; } }
.brief .rules b{ color:var(--gold); }
.brief-actions{ display:flex; gap:12px; flex-wrap:wrap; margin-top:20px; }

/* ---------- partie : en-tête ---------- */
.gamehead{ position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--tabbar) 88%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); padding:10px clamp(12px,3vw,24px); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.gamehead .who{ display:flex; align-items:center; gap:10px; min-width:0; }
.gamehead .home{ background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:10px; width:34px; height:34px;
  display:inline-flex; align-items:center; justify-content:center; }
.gamehead .home:hover{ border-color:var(--gold); }
.gamehead .restart:hover{ box-shadow:inset 0 0 0 1.5px var(--gold); }
.gamehead .stitle{ font-family:var(--font-disp); font-size:clamp(16px,3.4vw,21px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gamehead .stag{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); font-weight:700; }
.gamehead .spacer{ flex:1; }
.stats{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.stat{ background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:13.5px; font-weight:600; white-space:nowrap; }
.stat b{ color:var(--gold); font-variant-numeric:tabular-nums; }
.chrono{ font-family:var(--font-disp); font-size:24px; font-weight:700; background:#1d1420; color:#fff; border:1.5px solid var(--accent);
  border-radius:12px; padding:4px 16px; font-variant-numeric:tabular-nums; letter-spacing:.04em; }
.chrono small{ display:block; font-family:var(--font-body); font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); text-align:center; }
.chrono.urgent{ animation:pulse 1s infinite; border-color:#ff5a4a; color:#ff8a7a; }
@keyframes pulse{ 50%{ box-shadow:0 0 16px rgba(224,90,74,.55); } }
.chronowrap{ display:flex; flex-direction:column; gap:4px; align-items:stretch; }
.chronobar{ height:6px; border-radius:3px; background:rgba(255,255,255,.12); position:relative; overflow:hidden; min-width:120px; }
.chronobar i{ position:absolute; inset:0; background:linear-gradient(90deg,var(--gold),var(--accent)); border-radius:3px; transition:width .3s linear; }
.chronobar .mark{ position:absolute; top:-2px; bottom:-2px; width:2px; background:rgba(255,255,255,.6); }

/* ---------- navigation basse ---------- */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--tabbar); border-top:1px solid var(--line);
  display:flex; padding:6px 4px calc(8px + env(safe-area-inset-bottom)); }
.tabbar button{ flex:1; background:none; border:0; color:var(--muted); font-size:12px; font-weight:700; padding:8px 4px;
  display:flex; flex-direction:column; align-items:center; gap:4px; border-radius:10px; position:relative; }
.tabbar button .ic{ width:22px; height:22px; }
.tabbar button.active{ color:var(--tab-active); }
.tabbar button .n{ position:absolute; top:2px; right:calc(50% - 26px); background:var(--accent-deep); color:#fff; font-size:10px;
  min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 5px; }

/* ---------- cartes de lieux ---------- */
.sect{ font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:22px 0 10px; }
.locgrid{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr)); }
.loc{ background:var(--paper); color:var(--paper-ink); border:0; border-radius:var(--radius); padding:18px 16px; text-align:left;
  box-shadow:var(--shadow); display:flex; gap:14px; align-items:flex-start; position:relative; transition:transform .14s ease; width:100%; }
.loc:hover{ transform:translateY(-2px); }
.loc .badge{ width:46px; height:46px; border-radius:14px; flex:none; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg, rgba(200,57,43,.16), rgba(200,57,43,.05)); color:var(--accent-deep); border:1.5px solid rgba(200,57,43,.3); }
.loc .badge .ic{ width:24px; height:24px; }
.loc h3{ font-size:18px; margin:0 0 4px; }
.loc p{ font-size:13.5px; color:var(--paper-mut); margin:0; line-height:1.45; }
.loc .who-here{ margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
.loc .who-here span{ font-size:11.5px; background:rgba(47,36,21,.08); border-radius:999px; padding:3px 10px; font-weight:600; }
.loc .found{ position:absolute; top:10px; right:12px; font-size:11.5px; font-weight:800; color:var(--ok-deep); }
.loc.hidden-loc{ background:var(--card); color:var(--faint); box-shadow:none; border:1.5px dashed var(--line); align-items:center; cursor:default; }
.loc.hidden-loc .badge{ background:transparent; border-style:dashed; color:var(--faint); }
body.palette-kid .loc .badge{ background:linear-gradient(160deg, rgba(232,115,74,.22), rgba(242,193,78,.10)); color:#c15a33; border-color:rgba(232,115,74,.35); }

/* ---------- détail d'un lieu ---------- */
.backrow{ margin-bottom:12px; }
.locdetail{ background:var(--paper); color:var(--paper-ink); border-radius:var(--radius); padding:clamp(18px,3vw,28px); box-shadow:var(--shadow); position:relative; }
.locdetail::before{ content:""; position:absolute; top:-9px; left:40px; width:18px; height:18px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffe1a1, var(--gold) 60%, var(--gold-deep)); box-shadow:0 3px 6px rgba(0,0,0,.4); }
.locdetail h2{ font-size:clamp(24px,5vw,32px); display:flex; align-items:center; gap:12px; }
.searchlist{ display:grid; gap:10px; margin-top:8px; }
.searchbtn{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card); color:var(--ink);
  border:1.5px dashed var(--faint); border-radius:12px; padding:13px 16px; font-size:15px; font-weight:600; transition:all .14s; }
.searchbtn:hover{ border-color:var(--gold); border-style:solid; transform:translateY(-1px); }
.searchbtn.done{ border-style:solid; border-color:var(--ok-deep); background:rgba(78,138,74,.1); }
.searchbtn .ic{ color:var(--gold); }
.personrow{ display:grid; gap:10px; margin-top:8px; }
.person{ display:flex; align-items:center; gap:14px; background:var(--paper2); border:1px solid rgba(122,102,71,.3); border-radius:12px; padding:12px 14px; width:100%; text-align:left; color:var(--paper-ink); }
.person:hover{ border-color:var(--accent-deep); }
.person .avatar{ width:44px; height:44px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,var(--accent-deep),#7c1f16); color:#fff; font-family:var(--font-disp); font-size:19px; font-weight:700; }
body.palette-kid .person .avatar{ background:linear-gradient(160deg,#f2a65a,#d9762b); }
.person b{ display:block; font-size:16px; } .person small{ color:var(--paper-mut); font-size:13px; }
.person .go{ margin-left:auto; color:var(--accent-deep); font-weight:800; font-size:13px; white-space:nowrap; }
.person.dead{ opacity:.55; cursor:default; }
.actionrow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
.cluefound{ background:rgba(78,138,74,.12); border:1.5px solid var(--ok-deep); border-radius:12px; padding:13px 16px; margin-top:6px; color:var(--paper-ink); }
.cluefound b{ color:var(--ok-deep); }
@media (prefers-color-scheme: light){ .cluefound{ background:rgba(78,138,74,.14); } }

/* ---------- dialogue ---------- */
.dialog{ max-width:680px; margin:0 auto; }
.dialog .head{ display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 18px; margin-bottom:14px; }
.dialog .avatar{ width:52px; height:52px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,var(--accent-deep),#7c1f16); color:#fff; font-family:var(--font-disp); font-size:23px; }
body.palette-kid .dialog .avatar{ background:linear-gradient(160deg,#f2a65a,#d9762b); }
.dialog .head b{ font-size:19px; display:block; } .dialog .head small{ color:var(--muted); }
.log{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; max-height:44vh; overflow:auto; padding:2px; }
.msg{ max-width:88%; padding:11px 15px; border-radius:14px; font-size:15px; line-height:1.5; }
.msg.q{ align-self:flex-end; background:var(--accent-deep); color:#fff; border-bottom-right-radius:4px; font-weight:600; }
.msg.a{ align-self:flex-start; background:var(--paper); color:var(--paper-ink); border-bottom-left-radius:4px; box-shadow:var(--shadow); }
.msg.a .did{ font-size:12.5px; font-style:italic; color:var(--paper-mut); }
.msg.sys{ align-self:center; font-size:13px; color:var(--muted); font-style:italic; }
.qs{ display:grid; gap:10px; }
.qbtn{ width:100%; text-align:left; background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-radius:12px;
  padding:13px 16px; font-size:15px; font-weight:600; display:flex; gap:10px; align-items:flex-start; transition:all .14s; }
.qbtn:hover:not(:disabled){ border-color:var(--gold); }
.qbtn.asked{ opacity:.55; }
.qbtn.asked .done-check{ color:var(--ok); }
.qbtn.locked{ opacity:.6; border-style:dashed; cursor:not-allowed; }
.qbtn .locknote{ display:block; font-size:12.5px; font-weight:400; color:var(--muted); margin-top:4px; }
.qgroup{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:6px 2px -2px; }

/* ---------- inventaire / indices ---------- */
.invlist{ display:grid; gap:12px; }
.cluecard{ background:var(--paper); color:var(--paper-ink); border-radius:12px; padding:16px 18px 16px 52px; position:relative; box-shadow:var(--shadow); }
.cluecard::before{ content:""; position:absolute; top:-8px; left:22px; width:16px; height:16px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff9a8a, #c0392b 60%, #7c1f16); box-shadow:0 2px 5px rgba(0,0,0,.4); }
.cluecard h4{ margin:0 0 4px; font-size:16px; font-family:var(--font-body); font-weight:800; }

let S = null;

function allQuestions(ch){ const q = ch.questions.map(x=>({...x, bonus:false})); (ch.followup||[]).forEach(x=>q.push({...x, bonus:true})); return q; }
function qKey(ch){ return ch.id; }
function clueCountTotal(){ const s=sc(); return Object.keys(s.clues).length; }
function clueCount(){ const s=sc(); let n=0; for(const k of Object.keys(s.clues)) if(S.clues.has(k)) n++; return n; }
function locState(lid){ const s=sc(); const l=s.locations.find(x=>x.id===lid);
  if(l.hiddenUntil==='unlocked' && !S.unlocked.has(lid)) return 'hidden';
  if(l.phase && l.phase > S.phase) return 'hidden';
  return 'open';
}
function locCluesVisible(l){ // clues of a location visible in current phase
  if(locState(l.id)!=='open') return [];
  return (l.clues||[]).filter(c=>{ const cp=(l.cluePhase||{})[c]||1; return cp<=S.phase; });
}
function charAt(lid){ return sc().characters.filter(c=>c.where===lid); }
function charDead(c){ return c.gonePhase && S.phase>=c.gonePhase; }
function qVisible(ch, q){
  if(charDead(ch)) return false;
  if(q.phase && q.phase>S.phase) return false;
  if(q.buttler===true) return false;
  return true;
}
function qLockedReason(q){
  if(q.req && !S.clues.has(q.req)) return 'Un indice te manque pour poser cette question (trouve-le d\u2019abord).';
  return null;
}
function askedCount(chid){ return (S.asked[chid]||new Set()).size; }

function scoreAdult(){ return Math.max(0, 1000 - 50*S.hints - 100*S.errors); }
function timerElapsed(){
  if(!S.timer.running) return S.timer.elapsedBase;
  return S.timer.elapsedBase + (Date.now()-S.timer.last)/1000;
}
function scoreDetective(elapsedSec){
  const t = elapsedSec==null?timerElapsed():elapsedSec;
  const bonus = t<=300?500:(t<=600?250:0);
  return Math.max(0, 1000 + bonus - 50*S.hints);
}
function starsKid(){
  if(S.errors<=1 && S.hints<=2) return 3;
  if(S.errors<=4 && S.hints<=5) return 2;
  return 1;
}

/* ---------- notifications ---------- */
function toast(msg, cls){
  const box=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast '+(cls||'');
  el.innerHTML=msg;
  box.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),350); }, 3400);
}
function modal(html, cls){
  const m=document.getElementById('modal');
  m.innerHTML='<div class="modal-back"><div class="modal '+(cls||'')+'" role="dialog" aria-modal="true">'+html+'</div></div>';
  m.querySelector('.modal-back').addEventListener('click', e=>{
    if(e.target.classList.contains('modal-back') && !e.target.dataset.sticky) closeModal();
  });
}
function closeModal(){ document.getElementById('modal').innerHTML=''; }

function grantClue(cid, silent){
  const c=sc().clues[cid];
  if(!c || S.clues.has(cid)) return false;
  S.clues.add(cid);
  if(!silent){
    toast(I('card')+'<div><b>Indice découvert</b><br>'+esc(c.t)+'</div>','clue');
  }
  if(c.unlockLocation && !S.unlocked.has(c.unlockLocation)){
    S.unlocked.add(c.unlockLocation);
    const l=sc().locations.find(x=>x.id===c.unlockLocation);
    if(!silent) toast(I('map')+'<div><b>Nouveau lieu</b><br>'+esc(l.name)+'</div>','lieu');
  }
  if(S.accLocked){ // un nouvel indice rouvre l'accusation suspendue
    S.accLocked=false;
    if(!silent) toast(I('key')+'<div><b>Accusation rouverte !</b><br>Ce nouvel indice te permet d\u2019accuser à nouveau.</div>');
  }
  saveProgress(); // sauvegarde automatique à chaque indice trouvé
  return true;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- sauvegarde locale ---------- */
const SAVE_KEY='myst-nord.save.v1';
function saveProgress(){
  if(!S || S.view!=='game') return;
  try{
    const asked={};
    for(const k of Object.keys(S.asked||{})) asked[k]=[...(S.asked[k]||[])];
    const data={
      v:1, sc:S.sc, tab:S.tab, loc:S.loc, char:S.char,
      clues:[...S.clues], unlocked:[...S.unlocked],
      asked:asked, log:S.log, errors:S.errors, hints:S.hints, phase:S.phase,
      choice:S.choice, nb:S.nb, tri:S.tri, onceDone:[...S.onceDone],
      accTries:S.accTries, braqued:[...S.braqued], accLocked:!!S.accLocked,
      timer:{ running:!!(S.timer&&S.timer.running),
        elapsedBase: Math.max(0, S.timer?timerElapsed():0),
        fired:[...((S.timer&&S.timer.fired)||[])],
        warned:[...((S.timer&&S.timer.warned)||[])] }
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }catch(e){ /* sauvegarde impossible : on joue sans filet */ }
}
function loadSave(){
  let raw=null;
  try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){ return null; }
  if(!raw) return null;
  try{
    const d=JSON.parse(raw);
    if(!d || d.v!==1 || !SCENARIOS[d.sc]) return null; // données corrompues → accueil comme avant
    const scen=SCENARIOS[d.sc];
    const tabs=['map','clues','note','accuse'];
    const sv={
      sc:d.sc, view:'game', tab: tabs.indexOf(d.tab)>=0?d.tab:'map', loc:null, char:null,
      clues:new Set(), unlocked:new Set(),
      asked:{}, log:{}, errors:0, hints:0, phase:1, won:false, fail:false,
      choice:{}, nb:{}, tri:{}, onceDone:new Set(), lastWrong:null,
      accTries:0, braqued:new Set(), accLocked:false,
      timer:{running:false, elapsedBase:0, last:Date.now(), fired:new Set(), warned:new Set()}
    };
    if(Array.isArray(d.clues)) for(const c of d.clues){ if(typeof c==='string'&&scen.clues[c]) sv.clues.add(c); }
    if(Array.isArray(d.unlocked)) for(const u of d.unlocked){ if(typeof u==='string'&&scen.locations.some(l=>l.id===u)) sv.unlocked.add(u); }
    if(d.asked&&typeof d.asked==='object') for(const k of Object.keys(d.asked)){
      if(scen.characters.some(c=>c.id===k)&&Array.isArray(d.asked[k])) sv.asked[k]=new Set(d.asked[k].filter(x=>typeof x==='string'));
    }
    if(d.log&&typeof d.log==='object') for(const k of Object.keys(d.log)){
      if(scen.characters.some(c=>c.id===k)&&Array.isArray(d.log[k]))
        sv.log[k]=d.log[k].filter(m=>m&&typeof m==='object'&&typeof m.q==='string'&&typeof m.a==='string');
    }
    sv.errors=Math.max(0, parseInt(d.errors,10)||0);
    sv.hints=Math.max(0, parseInt(d.hints,10)||0);
    sv.phase=Math.min(3, Math.max(1, parseInt(d.phase,10)||1));
    if(d.choice&&typeof d.choice==='object') for(const k of Object.keys(d.choice)){ if(typeof d.choice[k]==='string') sv.choice[k]=d.choice[k]; }
    if(d.nb&&typeof d.nb==='object') for(const k of Object.keys(d.nb)){ if(typeof d.nb[k]==='boolean') sv.nb[k]=d.nb[k]; }
    if(d.tri&&typeof d.tri==='object') for(const k of Object.keys(d.tri)){ if(['q','s','e'].indexOf(d.tri[k])>=0) sv.tri[k]=d.tri[k]; }
    if(Array.isArray(d.onceDone)) sv.onceDone=new Set(d.onceDone.filter(x=>typeof x==='string'));
    sv.accTries=Math.max(0, parseInt(d.accTries,10)||0);
    if(Array.isArray(d.braqued)) sv.braqued=new Set(d.braqued.filter(x=>typeof x==='string'&&(scen.characters||[]).some(c=>c.id===x)));
    sv.accLocked=!!d.accLocked;
    // écran : restaurer si encore valide, sinon la carte
    if(typeof d.loc==='string'){
      const l=scen.locations.find(x=>x.id===d.loc);
      if(l && !(l.hiddenUntil==='unlocked'&&!sv.unlocked.has(l.id)) && (!l.phase||l.phase<=sv.phase)) sv.loc=l.id;
    }
    if(typeof d.char==='string'){
      const c=scen.characters.find(x=>x.id===d.char);
      if(c && !(c.gonePhase&&sv.phase>=c.gonePhase)) sv.char=c.id;
    }
    if(scen.chrono&&d.timer&&typeof d.timer==='object'){
      sv.timer.elapsedBase=Math.min(899.9, Math.max(0, parseFloat(d.timer.elapsedBase)||0));
      if(Array.isArray(d.timer.fired)) sv.timer.fired=new Set(d.timer.fired.filter(p=>p===2||p===3));
      if(Array.isArray(d.timer.warned)) sv.timer.warned=new Set(d.timer.warned.filter(p=>typeof p==='number'));
    }
    if(sv.clues.size===0 && sv.hints===0) return null; // pas de véritable progression
    return sv;
  }catch(e){ return null; } // JSON corrompu → accueil, sans planter
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function resumeInfo(){
  let sv=null;
  try{ sv=loadSave(); }catch(e){ sv=null; }
  if(!sv) return null;
  const scen=SCENARIOS[sv.sc];
  return {title:scen.title, n:sv.clues.size, total:Object.keys(scen.clues).length};
}
function resumeGame(){
  const sv=loadSave();
  if(!sv){ goHome(); return; } // corrompu entre-temps → accueil comme avant
  stopChrono();
  S=sv;
  const s=sc();
  document.body.classList.toggle('palette-kid', s.palette==='kid');
  document.body.classList.remove('no-nav');
  if(s.chrono) resumeTimer();
  render();
  toast(I('key')+'<div><b>Enquête reprise</b><br>'+esc(s.title)+' — là où tu l\u2019avais laissée.</div>');
}

/* ---------- chrono détective ---------- */
function startChrono(){
  stopChrono();
  S.timer={running:true, elapsedBase:0, last:Date.now(), fired:new Set(), warned:new Set()};
  S.phase=1;
  timerId=setInterval(tick,200);
  tick();
}
function stopChrono(){ if(timerId){ clearInterval(timerId); timerId=null; } if(S) S.timer.running=false; }
function resumeTimer(){ // reprise : le chrono repart là où il était
  stopChrono();
  S.timer.last=Date.now();
  S.timer.running=true;
  timerId=setInterval(tick,200);
  tick();
}
function penaltySeconds(sec){
  S.timer.elapsedBase+=sec; // avance le temps écoulé (enlève du temps restant)
  tick(true);
}
function tick(force){
  if(!S || S.view!=='game' || !S.timer.running) return;
  const el=timerElapsed();
  const s=sc();
  // événements de phase
  for(const ev of s.events){
    if(el>=ev.at && !S.timer.fired.has(ev.phase)){
      S.timer.fired.add(ev.phase);
      S.phase=ev.phase;
      fireEvent(ev);
    }
  }
  // alertes 1 minute avant chaque échéance
  for(const d of [300,600,900]){
    if(el>=d-60 && el<d && !S.timer.warned.has(d)){
      S.timer.warned.add(d);
      toast(I('clock')+'<div>Vous entendez un bruit sourd...</div>','warn');
    }
  }
  // échec du chrono
  if(el>=900){
    stopChrono();
    detectiveFail();
    return;
  }
  updateChronoUI(el);
}
function updateChronoUI(el){
  const e = el==null?timerElapsed():el;
  const rem=Math.max(0, 900-e);
  const mm=String(Math.floor(rem/60)).padStart(2,'0');
  const ss=String(Math.floor(rem%60)).padStart(2,'0');
  const c=document.getElementById('chronoTime');
  if(c){
    c.textContent=mm+':'+ss;
    const box=document.getElementById('chronoBox');
    const next = e<300?300:(e<600?600:900);
    box.classList.toggle('urgent', (next-e)<=60);
    const bar=document.getElementById('chronobar');
    if(bar) bar.style.width=(100*(rem/900))+'%';
  }
  const sp=document.getElementById('scorePot');
  if(sp) sp.textContent=scoreDetective(e);
}
function fireEvent(ev){
  modal('<h3>'+esc(ev.title)+'</h3><p>'+ev.text+'</p><div class="mrow"><button class="btn" onclick="closeModal();render();">Reprendre l\u2019enquête</button></div>','alarm');
  saveProgress(); // phase et chrono sauvegardés
  // débloque visuellement les lieux de phase (la modale reste au-dessus)
  render();
}
function detectiveFail(){
  stopChrono(); clearSave(); // enquête terminée : la sauvegarde n'a plus lieu d'être
  S.view='finale'; S.fail=true;
  render();
}

function statsHTML(){
  const s=sc(); const out=[];
  out.push('<span class="stat">'+I('card')+' Indices <b>'+clueCount()+'/'+clueCountTotal()+'</b></span>');
  if(s.kind==='observe') return out.join('');
  if(s.palette==='kid'){
    const st=starsKid();
    out.push('<span class="stat">Étoiles <b>'+'\u2605'.repeat(st)+'\u2606'.repeat(3-st)+'</b></span>');
  } else if(!s.chrono){
    out.push('<span class="stat">Score <b>'+scoreAdult()+'</b></span>');
  }
  return out.join('');
}
function chronoHTML(){
  if(!sc().chrono) return '';
  const el=timerElapsed();
  const rem=Math.max(0,900-el);
  const mm=String(Math.floor(rem/60)).padStart(2,'0'), ss=String(Math.floor(rem%60)).padStart(2,'0');
  const pct=100*(rem/900);
  const next=el<300?300:(el<600?600:900);
  return '<div class="chronowrap"><div class="chrono'+((next-el)<=60?' urgent':'')+'" id="chronoBox"><small>Temps restant</small><span id="chronoTime">'+mm+':'+ss+'</span></div>'+
    '<div class="chronobar"><i id="chronobar" style="width:'+pct+'%"></i>'+
    '<span class="mark" style="left:66.6%"></span><span class="mark" style="left:33.3%"></span></div></div>';
}

function dialogHTML(){
  const s=sc();
  const c=s.characters.find(x=>x.id===S.char);
  const log=S.log[c.id]||[];
  let h='<div class="backrow"><button class="linkbtn" onclick="backToLoc()">← Retour au lieu</button></div>';
  h+='<div class="dialog"><div class="head"><span class="avatar">'+esc(c.name.trim()[0])+'</span><div><b>'+esc(c.name)+'</b><small>'+c.role+'</small></div></div>';
  h+='<div class="log" id="dlog">';
  h+='<div class="msg sys">'+c.intro+'</div>';
  for(const m of log){
    h+='<div class="msg q">'+m.q+'</div><div class="msg a">'+(m.stage?'<span class="did">'+m.stage+'<br></span>':'')+m.a+'</div>';
  }
  h+='</div>';
  const qs=allQuestions(c);
  const main=qs.filter(q=>!q.bonus), bonus=qs.filter(q=>q.bonus);
  h+='<div class="qs">';
  let bi=0;
  const renderQ=(q,gi)=>{
    const key=q.bonus?('b'+(bi++)):(gi);
    const asked=(S.asked[c.id]||new Set()).has(key);
    const lock=qLockedReason(q);
    const vis=qVisible(c,q);
    if(!vis) return '';
    if(S.braqued && S.braqued.has(c.id) && !asked){
      return '<button class="qbtn locked" disabled>'+I('lock')+'<span>'+esc(q.q)+'<span class="locknote">'+esc(c.name)+' ne veut plus répondre... (fausse accusation)</span></span></button>';
    }
    if(lock){
      return '<button class="qbtn locked" disabled>'+I('lock')+'<span>'+esc(q.q)+'<span class="locknote">'+lock+'</span></span></button>';
    }
    return '<button class="qbtn'+(asked?' asked':'')+'" onclick="askQ(\''+c.id+'\',\''+key+'\')">'+(asked?I('check')+'<span class="done-check" style="display:none"></span>':'')+'<span>'+esc(q.q)+'</span></button>';
  };
  main.forEach((q,gi)=>{ h+=renderQ(q,gi); });
  if(bonus.length){ h+='<div class="qgroup">Encore une question...</div>'; bonus.forEach(q=>{ h+=renderQ(q,'b'); }); }
  h+='</div></div>';
  return h;
}
// clé des questions : index dans main / 'b'+index dans followup
function askQ(cid, key){
  const c=sc().characters.find(x=>x.id===cid);
  const main=c.questions, bonus=c.followup||[];
  let q, isMain=true;
  if(String(key).startsWith('b')){ q=bonus[parseInt(String(key).slice(1),10)]; isMain=false; }
  else q=main[parseInt(key,10)];
  if(!q || qLockedReason(q) || !qVisible(c,q)) return;
  if(!(S.asked[cid])) S.asked[cid]=new Set();
  const firstTime=!S.asked[cid].has(key);
  S.asked[cid].add(key);
  if(!S.log[cid]) S.log[cid]=[];
  if(firstTime || true){
    // on n\u2019ajoute le doublon que si c\u2019est une première réponse
    if(firstTime) S.log[cid].push({q:esc(q.q), a:q.a, stage:q.stage});
    if(q.grants) for(const g of q.grants) grantClue(g);
    // indice automatique : tous interrogés (scénario adulte)
    const auto=sc().autoClue;
    if(auto && !S.clues.has(auto.id)){
      const allOk=auto.needAllAsked.every(xid=>(S.asked[xid]&&S.asked[xid].size>0));
      if(allOk) grantClue(auto.id);
    }
  }
  saveProgress(); // questions posées + dialogues sauvegardés
  render();
  const dl=document.getElementById('dlog');
  if(dl) dl.scrollTop=dl.scrollHeight;
}

    if(!S.choice['opt']){ toast(I('flag')+'<div>Choisis d\u2019abord une hypothèse !</div>','warn'); return; }
  } else {
    for(const sec of ac.sections){
      if(!S.choice[sec.key]){ toast(I('flag')+'<div>Choisis une réponse pour chaque volet !</div>','warn'); return; }
    }

}
function accusedInfo(){
  const s=sc(); const ac=s.accusation;
  let id=null, label='';
  if(ac.kind==='single'){
    const o=ac.options.find(x=>x.id===S.choice['opt']);
    id=o.id; label=o.t;
  } else {
    const sec0=ac.sections[0];
    const o=sec0.options.find(x=>x.id===S.choice[sec0.key]);
    id=o.id; label=o.t;
  }
  const ch=(s.characters||[]).find(c=>c.id===id);
  return {id:id, label:label, ch:ch||null};
}
function renderJaccuse(app){
  const s=sc(); const ac=s.accusation; const ai=accusedInfo();
  const strict=!!s.strictAccuse;
  let volets='';
  if(ac.kind==='triple'){
    volets='<div class="volets">'+ac.sections.map(sec=>{
      const o=sec.options.find(x=>x.id===S.choice[sec.key]);
      return '<div class="volet"><b>'+esc(sec.label)+' :</b> '+esc(o.t)+'</div>';
    }).join('')+'</div>';
  }
  app.innerHTML='<div class="view"><div class="jaccuse"><div class="stage">'+
    '<h1>J\u2019ACCUSE !</h1>'+
    '<p class="subacc">La salle retient son souffle...</p>'+
    '<div class="accused"><div class="bigavatar">'+esc(ai.label.trim()[0])+'</div>'+
    '<div class="aname">'+esc(ai.label)+'</div></div>'+
    volets+
    (strict?'<p class="tries">Tentative <b>'+(S.accTries+1)+' / 2</b>'+(S.accTries>0?' — la dernière !':'')+'</p>':'')+
    '<div class="mrow"><button class="btn danger" onclick="prononcer()">'+I('flag')+' Prononcer l\u2019accusation</button>'+
    '<button class="btn secondary" onclick="S.view=\'game\';S.tab=\'accuse\';render()">Revenir sur mes choix</button></div>'+
  '</div></div></div>';
}
function prononcer(){
  const s=sc(); const ac=s.accusation; const ai=accusedInfo();
  let ok=false, correctCount=0, total=0;
  if(ac.kind==='single'){
    total=1;
    const o=ac.options.find(x=>x.id===S.choice['opt']);
    ok=!!(o&&o.correct); if(ok) correctCount=1;
  } else {
    total=ac.sections.length; ok=true;
    for(const sec of ac.sections){
      const o=sec.options.find(x=>x.id===S.choice[sec.key]);
      if(o&&o.correct) correctCount++; else ok=false;
    }
  }
  if(ok){
    const recap=s.solutionRecap?'<div class="sol" style="text-align:left">'+s.solutionRecap+'</div>':'';
    modal('<h3>La vérité éclate !</h3>'+recap+
      '<div class="mrow"><button class="btn" onclick="closeModal();'+(ac.kind==='single'?'kidWin()':'caseWin()')+'">Voir la fin</button></div>');
    return;
  }
  // ---- verdict : erreur ----
  S.errors++;
  if(s.chrono) penaltySeconds(120);
  S.view='game'; // la sauvegarde exige la vue 'game'
  if(s.strictAccuse){
    S.accTries++;
    if(ai.ch) S.braqued.add(ai.ch.id);
    const remaining=Object.keys(s.clues).some(cid=>!S.clues.has(cid));
    if(S.accTries>=2 && remaining) S.accLocked=true;
    S.tab='map';
    saveProgress();
    modal('<h3>'+esc(s.wrongTitle)+'</h3>'+
      (ai.ch?'<p><b>'+esc(ai.ch.name)+'</b> se braque et ne répondra plus à tes nouvelles questions.</p>':'')+
      '<p>'+(S.accLocked
        ?'Deuxième erreur... <b>l\u2019accusation est suspendue</b>. Trouve un <b>nouvel indice</b> pour la rouvrir.'
        :'Il te reste <b>'+(2-S.accTries)+' tentative'+((2-S.accTries)>1?'s':'')+'</b>. Resserre ta déduction !')+'</p>'+
      '<div class="mrow"><button class="btn" onclick="closeModal();S.view=\'game\';S.tab=\'map\';render()">Retourner enquêter</button></div>');
  } else {
    S.lastWrong={title:s.wrongTitle, msg:(ac.kind==='triple'?'<b>'+correctCount+'/'+total+' volets sont justes.</b> ':'')+s.wrongMsg};
    S.tab='accuse';
    saveProgress();
    render();
  }
}

  let content='';
  if(S.oacc) content=observeAccuseHTML();
  else if(S.oloc) content=observeSceneHTML();
  else content=observePlacesHTML();
  app.innerHTML=head+'<div class="view"><div class="ob-view">'+content+'</div></div>';
}
function observePlacesHTML(){
  const s=sc();
  const done3=clueCount()>=3;
  let h='<p class="ob-hint">👀 Touche un lieu pour bien regarder...</p><div class="ob-places">';
  for(const p of s.places){
    const done=S.clues.has(p.clue);
    h+='<button class="ob-place'+(done?' done':'')+'" onclick="S.oloc=\''+p.id+'\';render()" aria-label="'+esc(p.name)+'">'+
      p.svg+'<div class="pname">'+esc(p.name)+'</div></button>';
  }
  h+='</div>';
  if(done3){
    h+='<p style="text-align:center;margin-top:22px"><button class="btn" style="font-size:20px;padding:16px 30px" onclick="S.oacc=true;S.oloc=null;render()">🤔 Qui a fait ça ?</button></p>';
  }
  return h;
}
function observeSceneHTML(){
  const s=sc();
  const p=s.places.find(x=>x.id===S.oloc);
  const hs=p.hs;
  return '<p class="ob-hint">👀 Touche ce qui cloche...</p>'+
    '<div class="ob-scene">'+p.svg+
    '<button class="hotspot" style="left:'+hs.l+'%;top:'+hs.t+'%;width:'+hs.s+'%;height:'+(hs.s*1.0)+'%" onclick="observeFound(\''+p.clue+'\')" aria-label="Toucher ce qui cloche"></button></div>'+
    '<div class="ob-back"><button class="btn secondary" onclick="S.oloc=null;render()">← Les lieux</button></div>';
}
function observeFound(cid){
  if(S.clues.has(cid)){ S.oloc=null; render(); return; }
  grantClue(cid, true);
  toast('<div style="text-align:center"><span class="popstar" style="font-size:30px">⭐</span><div><b>Bravo !</b></div></div>');
  S.oloc=null;
  render();
}
function observeAccuseHTML(){
  const s=sc();
  let h='<p class="ob-hint">🤔 Qui a pris le goûter ?<br><span style="font-size:16px;font-weight:400">Touche « Son indice » pour voir l\u2019indice de chacun.</span></p><div class="ob-portraits">';
  for(const sp of s.suspects){
    h+='<div class="portrait" id="portrait-'+sp.id+'">'+sp.portrait+
      '<div class="pname">'+esc(sp.name)+'</div><div class="pwho">'+esc(sp.who)+'</div>'+
      '<button class="btn small secondary" style="margin-top:8px;min-height:48px;width:100%" onclick="observeShowClue(\''+sp.id+'\')">🔍 Son indice</button>'+
      '<button class="btn accusebtn" onclick="observeVerdict(\''+sp.id+'\')">👉 C\u2019est '+esc(sp.pron)+' !</button></div>';
  }
  return h+'</div><div class="ob-back"><button class="btn secondary" onclick="S.oacc=false;render()">← Les lieux</button></div>';
}
function observeShowClue(sid){
  const s=sc();
  const sp=s.suspects.find(x=>x.id===sid);
  modal('<h3 style="text-align:center">'+esc(sp.name)+' '+esc(sp.who)+'</h3>'+
    '<div class="ob-clueart">'+sp.clueArt+'</div>'+
    '<div class="mrow" style="justify-content:center"><button class="btn" onclick="closeModal()">OK</button></div>');
}
function observeVerdict(sid){
  const s=sc();
  const sp=s.suspects.find(x=>x.id===sid);
  if(sp.culprit){
    let conf='';
    const em=['⭐','🎉','🌟','🍪','❤️'];
    for(let i=0;i<24;i++){
      conf+='<span class="confetti" style="left:'+(Math.random()*96).toFixed(1)+'%;animation-delay:'+(Math.random()*1.2).toFixed(2)+'s">'+em[i%em.length]+'</span>';
    }
    document.body.insertAdjacentHTML('beforeend', conf);
    setTimeout(()=>{ document.querySelectorAll('.confetti').forEach(e=>e.remove()); }, 4500);
    stopChrono(); clearSave();
    S.view='finale'; S.won=true;
    render();
  } else {
    const el=document.getElementById('portrait-'+sid);
    if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    toast('<div style="text-align:center"><b>Essaie encore</b> 🌱</div>');
  }
}

/* ----- bouton « Recommencer » ----- */
function askRestart(){
  modal('<h3>Recommencer l\u2019enqu\u00eate ?</h3>'+
    '<p>Ta progression sera perdue.</p>'+
    '<div class="mrow"><button class="btn" onclick="doRestart()">↻ Recommencer</button>'+
    '<button class="btn secondary" onclick="closeModal()">Continuer</button></div>');
}
function doRestart(){
  const id=S.sc;
  stopChrono(); closeModal();
  startScenario(id);
}

/* ----- bouton « Demander un indice » ----- */
/* ---------- appel à la communauté (v1.2) ---------- */
/* Aucun appel réseau, aucune publication automatique : le joueur copie ou partage son SOS lui-même. */
function communityPlace(){
  var s=sc();
  if(S.loc){ var l=s.locations.find(function(x){return x.id===S.loc;}); if(l) return l.name; }
  return 'la carte';
}
function communitySOS(){
  var s=sc(), place=communityPlace();
  if(s.palette==='kid'){
    return '🧒 Allô les détectives ! Je joue à « Mystères du Nord » — « '+s.title+' » — pis je suis pris·e ('+place+'). Un petit indice, quelqu’un ? On peut demander à un grand ensemble ! Merci ! 💛 #MystèresDuNord';
  }
  return '🕵️ SOS enquête ! Je suis coincé·e dans « Mystères du Nord » — « '+s.title+' » ('+place+'). Quelqu’un a trouvé la piste ? Un indice, ça serait pas de refus ! 🤝 #MystèresDuNord';
}
function openCommunity(){
  var s=sc(), kid=(s.palette==='kid');
  var sos=communitySOS();
  modal(
    '<h3>'+I('community')+' '+(kid?'Besoin d\u2019un coup de pouce ?':'Coincé·e, détective ?')+'</h3>'+
    '<p class="msub">'+(kid?'Demande à un grand ou à la communauté des détectives du Nord !':'La communauté des détectives du Nord peut t\u2019aider — sans te donner la réponse.')+'</p>'+
    '<textarea class="sos-field" id="sosField" readonly>'+esc(sos)+'</textarea>'+
    '<p class="mnote">👆 Ton SOS est prêt : copie-le ou partage-le où TU veux (famille, amis, page HP…). Rien n\u2019est publié tout seul.</p>'+
    '<div class="mrow">'+
      '<button class="btn small" onclick="copySOS()">'+I('note')+' Copier mon SOS</button>'+
      '<button class="btn small secondary" onclick="shareSOS()">'+I('chat')+' Partager</button>'+
      '<button class="btn small secondary" onclick="closeModal()">'+I('x')+' Retour à l\u2019enquête</button>'+
    '</div>'
  );
  var f=document.getElementById('sosField'); if(f){ f.focus(); f.select(); }
}
function copySOS(){ copyText(communitySOS(),'SOS copié ! Colle-le où tu veux.'); }
function shareSOS(){
  var txt=communitySOS();
  if(navigator.share){
    navigator.share({title:'Mystères du Nord — SOS enquête', text:txt}).catch(function(e){
      if(e && e.name==='AbortError') return; /* annulé par le joueur : on ne fait rien */
      copyText(txt,'SOS copié ! Colle-le où tu veux.');
    });
  } else {
    copyText(txt,'SOS copié ! Colle-le où tu veux.');
  }
}
function copyText(txt, okMsg){
  function done(){ toast('📋 <b>'+okMsg+'</b>'); }
  function legacy(){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.setAttribute('readonly',''); ta.setAttribute('aria-hidden','true');
    ta.style.position='fixed'; ta.style.top='0'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ toast('⚠️ Copie impossible — sélectionne le texte à la main.'); }
    ta.remove();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, legacy);
  } else { legacy(); }
}

function requestHint(){
  const s=sc(); closeModal();
  let next=null;
  for(const cid of s.chain){
    if(S.clues.has(cid)) continue;
    const c=s.clues[cid];
    if(c.phase && c.phase>S.phase) continue; // pas encore disponible
    next=cid; break;
  }
  if(!next){
    const msg = s.id==='kid'
      ?'Tu as tous les fils de l\u2019enquête entre les mains ! Rends-toi au <b>perron de Mme Amina</b> et clique sur « Appeler Minou ». Ils t\u2019attendent...'
      :(s.chrono
        ?'Tu as découvert tous les indices accessibles <b>pour le moment</b>. Prépare ton accusation — le chrono tourne...'
        :'Tu as déjà découvert tout le fil logique de cette enquête. Relis ton tableau : la réponse est sous tes yeux.');
    modal('<h3>Tout est entre tes mains</h3><p>'+msg+'</p><div class="mrow"><button class="btn" onclick="closeModal()">Continuer</button></div>');
    return; // gratuit : rien révélé
  }
  S.hints++;
  grantClue(next, true);
  const c=s.clues[next];
  modal('<h3>'+I('bulb')+' Indice révélé</h3>'+
    '<div class="cluecard"><h4>'+esc(c.t)+'</h4><p>'+esc(c.d)+'</p></div>'+
    (c.unlockLocation?'<p>Un nouveau lieu vient d\u2019apparaître sur ta carte !</p>':'')+
    '<div class="mrow"><button class="btn" onclick="closeModal()">Continuer</button>'+
    '<button class="btn secondary" onclick="closeModal();setTab(\'clues\')">Voir dans l\u2019inventaire</button></div>');
  render();
}

/* ----- finales ----- */
function kidWin(){ stopChrono(); clearSave(); S.view='finale'; S.won=true; render(); }
function kidFinale(){ kidWin(); }
function caseWin(){ stopChrono(); clearSave(); S.view='finale'; S.won=true; S.winElapsed=timerElapsed(); render(); }

function renderFinale(app){
  const s=sc();
  document.body.classList.add('no-nav');
  let body='';
  if(S.fail){
    body='<div class="finale fail"><div class="paper"><h1>Le tueur s\u2019est enfui</h1>'+
      '<p class="story"><i>'+esc(s.failText)+'</i></p>'+
      '<p style="color:var(--paper-mut)">Indices trouvés : <b>'+clueCount()+'/'+clueCountTotal()+'</b>. La prochaine fois, fonce droit au but : les indices de la <b>phase 1</b> suffisent déjà à soupçonner fortement le coupable...</p>'+
      '<div class="actions"><button class="btn" onclick="startScenario(\'detective\')">'+I('clock')+' Recommencer</button>'+
      '<button class="btn secondary" onclick="goHome()">Accueil</button></div></div></div>';
  } else if(s.kind==='observe'){
    body='<div class="finale"><div class="paper"><div class="ob-win"><div style="font-size:56px">🎉</div>'+
      '<h1>'+esc(s.winTitle)+'</h1>'+
      '<p>'+esc(s.winText)+'</p>'+
      '<div class="actions"><button class="btn" onclick="startScenario(\''+s.id+'\')">Rejouer</button>'+
      '<button class="btn secondary" onclick="goHome()">Accueil</button></div></div></div></div>';
  } else if(s.accusation.kind==='single'){
    const st=starsKid();
    body='<div class="finale"><div class="paper"><div class="stars">'+'\u2605'.repeat(st)+'<span class="off">'+'\u2606'.repeat(3-st)+'</span></div>'+
      '<h1>'+esc(s.winTitle)+'</h1>'+
      '<p class="story">'+esc(s.winText)+'</p>'+
      '<div class="scoreboard"><b>Dossier de la jeune détective :</b><br>Erreurs d\u2019accusation : '+S.errors+' · Indices demandés : '+S.hints+' · Indices trouvés : '+clueCount()+'/'+clueCountTotal()+
      '<br><span style="font-size:13px;color:var(--paper-mut)">3 étoiles si ≤ 1 erreur et ≤ 2 indices demandés.</span></div>'+
      '<div class="actions"><button class="btn" onclick="startScenario(\''+s.id+'\')">Rejouer</button>'+
      '<button class="btn secondary" onclick="goHome()">Accueil</button></div></div></div>';
  } else {
    const elapsed=S.winElapsed||0;
    const mm=Math.floor(elapsed/60), ss=Math.floor(elapsed%60);
    let score;
    if(s.chrono){
      const bonus=elapsed<=300?500:(elapsed<=600?250:0);
      score=Math.max(0,1000+bonus-50*S.hints);
    } else score=scoreAdult();
    body='<div class="finale"><div class="paper"><h1>'+esc(s.winTitle)+'</h1>'+
      '<p class="story"><i>'+esc(s.winText)+'</i></p>'+
      '<div class="sol">'+s.solutionRecap+'</div>'+
      '<div class="scoreboard"><div class="big">'+score+' pts</div>'+
      (s.chrono
        ?'Enquête bouclée en <b>'+mm+':'+String(ss).padStart(2,'0')+'</b> · Base 1000'+(elapsed<=300?' + bonus rapidité 500 (avant la 2<sup>e</sup> victime !)':(elapsed<=600?' + bonus rapidité 250 (avant la 3<sup>e</sup> victime !)':' · pas de bonus rapidité'))
        :'Base 1000 − '+(100*S.errors)+' (erreurs) − '+(50*S.hints)+' (indices)')+
      '<br>Indices trouvés : '+clueCount()+'/'+clueCountTotal()+' · Indices demandés : '+S.hints+' · Erreurs : '+S.errors+'</div>'+
      '<div class="actions"><button class="btn" onclick="startScenario(\''+s.id+'\')">Rejouer</button>'+
      '<button class="btn secondary" onclick="goHome()">Accueil</button></div></div></div>';
  }
  app.innerHTML='<div class="view">'+body+'</div>';
}

/* ----- délégation d\u2019événements (carnet, accusation) ----- */
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.matches('[data-nb]')){ S.nb[t.dataset.nb]=t.checked; saveProgress(); }
  if(t.matches('[data-acc]')){
    const parts=t.dataset.acc.split('|');
    S.choice[parts[0]]=parts[1];
    S.lastWrong=null;
    render();
  }
});
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-tri]');
  if(!b || !S) return;
  const parts=b.dataset.tri.split('|');
  S.tri[parts[0]]=parts[1];
  const wrap=b.closest('.btns');
  wrap.querySelectorAll('button').forEach(x=>x.className='');
  b.className= parts[1]==='s'?'on-s':(parts[1]==='e'?'on-e':'on-q');
  saveProgress();
});

/* ----- init ----- */
render();
</script>
